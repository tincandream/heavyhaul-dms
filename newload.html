<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Fleet Board — Dispatch</title>

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="dashboard.css">


<style>

  /* ==========================================================
     FLEET BOARD — PAGE-SPECIFIC STYLES
     Shared application styling lives in:
     theme.css + dashboard.css
     ========================================================== */

  .frac {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }

  .f-ok {
    color: var(--hh-lime-dark, #687025);
  }

  .f-warn {
    color: #8a5a10;
  }

  .f-bad {
    color: var(--hh-pink-dark, #A14666);
  }

  .f-non {
    color: #747B82;
  }

  .stale {
    color: #8a5a10;
    font-size: 11.5px;
  }

  .verystale {
    color: var(--hh-pink-dark, #A14666);
    font-size: 11.5px;
  }

  .unit {
    font-weight: 600;
  }

  .act {
    font-size: 12.5px;
  }

  .act.need {
    color: var(--hh-pink-dark, #A14666);
  }

  .crit {
    border-left:
      3px solid
      var(--hh-pink, #D86A8E);
  }

  tr.row {
    cursor: pointer;
  }

</style>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

</head>


<body>


<!-- ==========================================================
     GLOBAL APPLICATION HEADER

     nav.js owns this element.
     Do not place navigation links directly inside it.
     ========================================================== -->

<header></header>



<!-- ==========================================================
     DISPATCH WORKSPACE
     ========================================================== -->

<main>


  <!-- ========================================================
       UNIFORM DISPATCH HEADER
       Same on Fleet Board, New Load and All Loads
       ======================================================== -->

  <section class="page-header">

    <h1>DISPATCH</h1>

    <p>
      Manage loads and daily dispatch activity.
    </p>

  </section>


  <!-- ========================================================
       SHARED DISPATCH TABS

       dispatch-tabs.js populates this element.
       ======================================================== -->

  <nav
  class="dispatch-tabs"
  id="dispatchTabs">
</nav>


<section class="workspace-heading">

  <h2>create new load</h2>

  <p>
    Book and prepare a heavy haul shipment from first call through dispatch.
  </p>

</section>


<!-- PARTIES -->

<div class="card">



  <!-- ========================================================
       FLEET BOARD SUMMARY TILES
       ======================================================== -->

  <div
    class="tiles"
    id="tiles">
  </div>



  <!-- ========================================================
       FILTER BAR
       ======================================================== -->

  <div class="bar">

    <input
      class="search"
      id="q"
      placeholder="Search truck, driver, load…"
    >


    <select id="fstatus">

      <option value="">
        All statuses
      </option>

    </select>


    <select id="fdriver">

      <option value="">
        All drivers
      </option>

    </select>


    <select id="fbroker">

      <option value="">
        All brokers
      </option>

    </select>


    <select id="fstate">

      <option value="">
        All states
      </option>

    </select>


    <span
      class="count"
      id="count">
    </span>

  </div>



  <!-- ========================================================
       FLEET BOARD TABLE
       ======================================================== -->

  <div class="wrap">

    <table>

      <thead>

        <tr>

          <th data-k="truck_number">
            Truck
          </th>

          <th data-k="driver_name">
            Driver
          </th>

          <th data-k="load_number">
            Load
          </th>

          <th data-k="display_status">
            Status
          </th>

          <th data-k="current_location_text">
            Location
          </th>

          <th data-k="destination">
            Destination
          </th>

          <th data-k="next_event_at">
            Next event
          </th>

          <th data-k="permits_open">
            Prm
          </th>

          <th data-k="escorts_total">
            Esc
          </th>

          <th data-k="next_action">
            Next action
          </th>

        </tr>

      </thead>


      <tbody id="body">

        <tr>

          <td
            colspan="10"
            class="msg">

            Loading…

          </td>

        </tr>

      </tbody>

    </table>

  </div>


</main>



<!-- ==========================================================
     SHARED APPLICATION SCRIPTS
     ========================================================== -->

<script src="nav.js"></script>

<script src="dispatch-tabs.js"></script>



<script>

/* ============================================================
   SUPABASE
   ============================================================ */

const SUPABASE_URL =
  'https://zyhdatteglxozsgnjhrm.supabase.co';


const SUPABASE_ANON_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5aGRhdHRlZ2x4b3pzZ25qaHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODEzMTAsImV4cCI6MjEwMDg1NzMxMH0.I4SlAWiqKk0oPv-0WRgVy_AAGnQ0NoT8-T8z62jIj7Y';



/* ============================================================
   GLOBAL VARIABLES
   ============================================================ */

const $ =
  id => document.getElementById(id);


let db = null;

let rows = [];

let sortKey = null;

let sortDir = 1;



/* ============================================================
   ERROR HANDLING
   ============================================================ */

function fail(text) {

  $('body').innerHTML =
    '<tr>' +
      '<td colspan="10" class="msg bad">' +
        text +
      '</td>' +
    '</tr>';

}



function esc(s) {

  return String(
    s == null
      ? ''
      : s
  ).replace(
    /[&<>"]/g,

    c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;'
    }[c])

  );

}



window.onerror = m => {

  fail(
    'JS error: ' + m
  );

};



/* ============================================================
   START SUPABASE
   ============================================================ */

if (
  typeof window.supabase === 'undefined'
) {

  fail(
    'Supabase library did not load. Check your connection and reload.'
  );

}

else {

  db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  start();

}



/* ============================================================
   START APPLICATION
   ============================================================ */

async function start() {


  /* ----------------------------------------------------------
     Check login session
     ---------------------------------------------------------- */

  const s =
    await db.auth.getSession();


  if (!s.data.session) {

    location.href =
      'index.html';

    return;

  }



  /* ----------------------------------------------------------
     Build global navigation

     buildNav returns the user's tenant_id.
     ---------------------------------------------------------- */

  const t =
    await buildNav(
      db,
      'Dispatch'
    );


  if (!t) {

    fail(
      'No app_users row linked to this login.'
    );

    return;

  }



  /* ----------------------------------------------------------
     Build Dispatch workspace tabs
     ---------------------------------------------------------- */

  buildDispatchTabs(
    'board.html'
  );



  /* ----------------------------------------------------------
     Load Fleet Board
     ---------------------------------------------------------- */

  load();



  /* ----------------------------------------------------------
     Refresh every 60 seconds
     ---------------------------------------------------------- */

  setInterval(
    load,
    60000
  );

}



/* ============================================================
   LOAD FLEET BOARD DATA
   ============================================================ */

async function load() {


  const r =
    await db
      .from('v_fleet_board')
      .select('*')
      .order('attention_rank')
      .order(
        'next_event_at',
        {
          nullsFirst: false
        }
      );


  if (r.error) {

    fail(
      'Fleet board query failed: ' +
      r.error.message
    );

    return;

  }


  rows =
    r.data || [];



  /* ----------------------------------------------------------
     Update timestamp in global navigation
     ---------------------------------------------------------- */

  const st =
    $('stamp');


  if (st) {

    st.textContent =
      'updated ' +
      new Date()
        .toLocaleTimeString(
          [],
          {
            hour: 'numeric',
            minute: '2-digit'
          }
        );

  }



  fillFilters();

  tiles();

  render();

}



/* ============================================================
   FILTER HELPERS
   ============================================================ */

function uniq(key) {

  return [
    ...new Set(
      rows
        .map(
          r => r[key]
        )
        .filter(Boolean)
    )
  ].sort();

}



function fillFilters() {


  const map = {

    fstatus:
      'display_status',

    fdriver:
      'driver_name',

    fbroker:
      'broker_name',

    fstate:
      'current_state'

  };


  for (
    const id in map
  ) {


    const sel =
      $(id);


    const keep =
      sel.value;


    const first =
      sel.options[0].textContent;


    sel.innerHTML =

      '<option value="">' +
        first +
      '</option>' +

      uniq(
        map[id]
      ).map(
        v =>

          '<option value="' +
          esc(v) +
          '">' +

          esc(
            pretty(v)
          ) +

          '</option>'

      ).join('');


    sel.value =
      keep;

  }

}



/* ============================================================
   TEXT FORMATTING
   ============================================================ */

function pretty(s) {

  if (!s) {

    return '';

  }


  return String(s)

    .replace(
      /_/g,
      ' '
    )

    .replace(
      /^./,
      c => c.toUpperCase()
    );

}



/* ============================================================
   SUMMARY TILES
   ============================================================ */

function tiles() {


  const t = [


    [
      'Active loads',

      rows.filter(
        r => r.load_id
      ).length,

      false
    ],


    [
      'Available trucks',

      rows.filter(
        r => !r.load_id
      ).length,

      false
    ],


    [
      'On hold',

      rows.filter(
        r => r.hold_reason
      ).length,

      rows.some(
        r => r.hold_reason
      )
    ],


    [
      'Waiting on permits',

      rows.filter(
        r => r.permits_open > 0
      ).length,

      rows.some(
        r => r.permits_open > 0
      )
    ],


    [
      'Escorts unbooked',

      rows.filter(
        r =>
          r.escorts_total >
          r.escorts_confirmed
      ).length,

      false
    ],


    [
      'Stale check-ins',

      rows.filter(
        r =>
          r.check_in_age_min >
          480
      ).length,

      rows.some(
        r =>
          r.check_in_age_min >
          480
      )
    ]

  ];



  $('tiles').innerHTML =

    t.map(
      ([label, n, alert]) =>

        '<div class="tile' +

        (
          alert && n > 0
            ? ' alert'
            : ''
        ) +

        '">' +

          '<div class="n">' +
            n +
          '</div>' +

          '<div class="l">' +
            label +
          '</div>' +

        '</div>'

    ).join('');

}



/* ============================================================
   STATUS PILL
   ============================================================ */

function statusPill(r) {


  const s =
    r.display_status || '';


  let cls =
    'p-gry';



  if (
    [
      'breakdown',
      'accident',
      'road_closure'
    ].includes(s)
  ) {

    cls =
      'p-red';

  }


  else if (
    r.hold_reason
  ) {

    cls =
      'p-amb';

  }


  else if (
    [
      'in_transit',
      'loaded',
      'dispatched',
      'en_route_to_pickup'
    ].includes(s)
  ) {

    cls =
      'p-blu';

  }


  else if (
    [
      'delivered',
      'pod_pending',
      'unloading'
    ].includes(s)
  ) {

    cls =
      'p-grn';

  }


  else if (
    [
      'loading',
      'at_shipper',
      'at_receiver',
      'at_weigh_station',
      'under_inspection'
    ].includes(s)
  ) {

    cls =
      'p-amb';

  }



  let html =

    '<span class="pill ' +
    cls +
    '">' +

    pretty(s) +

    '</span>';



  if (
    r.hold_reason &&
    r.load_status
  ) {

    html +=

      '<div class="sub2">' +

      'was ' +
      pretty(
        r.load_status
      ) +

      '</div>';

  }


  return html;

}



/* ============================================================
   FRACTION DISPLAY
   ============================================================ */

function frac(
  done,
  total
) {


  if (!total) {

    return (
      '<span class="frac f-non">' +
      '—' +
      '</span>'
    );

  }


  const cls =

    done === total
      ? 'f-ok'

      : (
          done === 0
            ? 'f-bad'
            : 'f-warn'
        );


  return (

    '<span class="frac ' +
    cls +
    '">' +

    done +
    '/' +
    total +

    '</span>'

  );

}



/* ============================================================
   DATE / TIME DISPLAY
   ============================================================ */

function when(iso) {


  if (!iso) {

    return (
      '<span class="sub2">' +
      '—' +
      '</span>'
    );

  }


  const d =
    new Date(iso);


  return (

    d.toLocaleDateString(
      [],
      {
        month: 'numeric',
        day: 'numeric'
      }
    )

    +

    ' '

    +

    d.toLocaleTimeString(
      [],
      {
        hour: 'numeric',
        minute: '2-digit'
      }
    )

  );

}



/* ============================================================
   CHECK-IN AGE
   ============================================================ */

function age(min) {


  if (
    min == null
  ) {

    return '';

  }


  const m =
    Math.round(min);


  const txt =

    m < 60

      ? m + 'm ago'

      : Math.round(
          m / 60
        ) + 'h ago';



  const cls =

    m > 480

      ? 'verystale'

      : (
          m > 240
            ? 'stale'
            : 'sub2'
        );


  return (

    '<div class="' +
    cls +
    '">' +

    txt +

    '</div>'

  );

}



/* ============================================================
   RENDER FLEET BOARD
   ============================================================ */

function render() {


  const q =

    $('q')
      .value
      .toLowerCase()
      .trim();



  let list =

    rows.filter(
      r => {


        if (
          $('fstatus').value &&
          r.display_status !==
          $('fstatus').value
        ) {

          return false;

        }


        if (
          $('fdriver').value &&
          r.driver_name !==
          $('fdriver').value
        ) {

          return false;

        }


        if (
          $('fbroker').value &&
          r.broker_name !==
          $('fbroker').value
        ) {

          return false;

        }


        if (
          $('fstate').value &&
          r.current_state !==
          $('fstate').value
        ) {

          return false;

        }



        if (q) {


          const hay = [

            r.truck_number,

            r.driver_name,

            r.load_number,

            r.broker_name,

            r.current_location_text,

            r.destination

          ]
          .filter(Boolean)
          .join(' ')
          .toLowerCase();


          if (
            !hay.includes(q)
          ) {

            return false;

          }

        }


        return true;

      }
    );



  /* ----------------------------------------------------------
     Sorting
     ---------------------------------------------------------- */

  if (sortKey) {


    list.sort(
      (a, b) => {


        const x =
          a[sortKey];


        const y =
          b[sortKey];


        if (
          x == null
        ) {

          return 1;

        }


        if (
          y == null
        ) {

          return -1;

        }


        return (

          (
            x > y
              ? 1
              : x < y
                ? -1
                : 0
          )

          *

          sortDir

        );

      }
    );

  }



  /* ----------------------------------------------------------
     Count
     ---------------------------------------------------------- */

  $('count').textContent =

    list.length +
    ' of ' +
    rows.length +
    ' trucks';



  /* ----------------------------------------------------------
     Empty result
     ---------------------------------------------------------- */

  if (
    !list.length
  ) {


    $('body').innerHTML =

      '<tr>' +

        '<td colspan="10" class="msg">' +

          'No trucks match.' +

        '</td>' +

      '</tr>';


    return;

  }



  /* ----------------------------------------------------------
     Rows
     ---------------------------------------------------------- */

  $('body').innerHTML =

    list.map(
      r => {


        const needs =

          r.next_action &&

          r.next_action !==
          'On track';



        return (

          '<tr class="row' +

          (
            r.priority === 'critical'
              ? ' crit'
              : ''
          ) +

          '"' +

          (
            r.load_id

              ? ' data-load="' +
                r.load_id +
                '"'

              : ''
          ) +

          '>' +



          /* Truck */

          '<td>' +

            '<span class="unit">' +
              esc(
                r.truck_number || ''
              ) +
            '</span>' +

            (
              r.trailer_type

                ? '<div class="sub2">' +

                    pretty(
                      r.trailer_type
                    ) +

                    (
                      r.trailer_number
                        ? ' ' +
                          esc(
                            r.trailer_number
                          )
                        : ''
                    ) +

                  '</div>'

                : ''
            ) +

          '</td>' +



          /* Driver */

          '<td>' +

            (
              r.driver_name

                ? esc(
                    r.driver_name
                  )

                : '<span class="sub2">' +
                    'unassigned' +
                  '</span>'
            ) +

            (
              r.driver_hours_remaining_min != null

                ? '<div class="sub2">' +

                    Math.floor(
                      r.driver_hours_remaining_min /
                      60
                    ) +

                    'h ' +

                    (
                      r.driver_hours_remaining_min %
                      60
                    ) +

                    'm HOS' +

                  '</div>'

                : ''
            ) +

          '</td>' +



          /* Load */

          '<td>' +

            (
              r.load_number

                ? '<span class="ldnum">' +

                    esc(
                      r.load_number
                    ) +

                  '</span>' +

                  (
                    r.broker_name

                      ? '<div class="sub2">' +

                          esc(
                            r.broker_name
                          ) +

                        '</div>'

                      : ''
                  )

                : '<span class="sub2">' +
                    '—' +
                  '</span>'
            ) +

          '</td>' +



          /* Status */

          '<td>' +

            statusPill(r) +

          '</td>' +



          /* Location */

          '<td>' +

            (
              r.current_location_text

                ? esc(
                    r.current_location_text
                  )

                : '<span class="sub2">' +
                    '—' +
                  '</span>'
            ) +

            age(
              r.check_in_age_min
            ) +

          '</td>' +



          /* Destination */

          '<td>' +

            (
              r.destination

                ? esc(
                    r.destination
                  )

                : '<span class="sub2">' +
                    '—' +
                  '</span>'
            ) +

          '</td>' +



          /* Next event */

          '<td>' +

            when(
              r.next_event_at
            ) +

            (
              r.next_event_label

                ? '<div class="sub2">' +

                    r.next_event_label +

                  '</div>'

                : ''
            ) +

          '</td>' +



          /* Permits */

          '<td>' +

            frac(
              r.permits_issued,
              r.permits_total
            ) +

            (
              r.has_window_conflict

                ? '<div class="verystale">' +
                    'window' +
                  '</div>'

                : ''
            ) +

          '</td>' +



          /* Escorts */

          '<td>' +

            frac(
              r.escorts_confirmed,
              r.escorts_total
            ) +

          '</td>' +



          /* Next action */

          '<td>' +

            '<span class="act' +

            (
              needs
                ? ' need'
                : ''
            ) +

            '">' +

              esc(
                r.next_action || ''
              ) +

            '</span>' +

          '</td>' +


          '</tr>'

        );

      }

    ).join('');

}



/* ============================================================
   FILTER EVENTS
   ============================================================ */

[
  'q',
  'fstatus',
  'fdriver',
  'fbroker',
  'fstate'
]
.forEach(
  id => {


    $(id).addEventListener(
      'input',
      render
    );


    $(id).addEventListener(
      'change',
      render
    );

  }
);



/* ============================================================
   TABLE SORTING
   ============================================================ */

document
  .querySelectorAll(
    'th[data-k]'
  )
  .forEach(
    th => {


      th.addEventListener(
        'click',
        () => {


          const k =
            th.dataset.k;


          if (
            sortKey === k
          ) {

            sortDir =
              -sortDir;

          }

          else {

            sortKey =
              k;

            sortDir =
              1;

          }


          render();

        }
      );

    }
  );



/* ============================================================
   OPEN LOAD WORKSPACE
   ============================================================ */

$('body')
  .addEventListener(
    'click',
    e => {


      const tr =
        e.target.closest(
          'tr[data-load]'
        );


      if (tr) {

        location.href =

          'workspace.html?id=' +

          tr.dataset.load;

      }

    }
  );


</script>


</body>

</html>
