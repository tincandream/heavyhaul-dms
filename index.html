<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Heavy Haul Command — Sign In</title>


  <!-- GOOGLE FONTS -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       HEAVY HAUL COMMAND
       LOGIN DESIGN
       ===================================================== */


    :root {

      /* BRAND PALETTE */

      --cream: #F5EAD6;

      --plum: #241A2A;

      --plum-panel: rgba(28, 19, 33, 0.93);

      --charcoal: #17171B;

      --walnut: #7A5A42;

      --walnut-light: #A48A70;

      --pink: #D94B7B;

      --lime: #AEBC39;

      --stone: #B9ADB8;

      --danger: #FF7C84;

      --success: #AEBC39;

    }



    /* =====================================================
       RESET
       ===================================================== */


    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }


    body {

      overflow: hidden;

      color: var(--cream);

      font-family:
        "Inter",
        sans-serif;


      background:

        linear-gradient(
          90deg,
          rgba(20, 12, 22, 0.08) 0%,
          rgba(20, 12, 22, 0.12) 42%,
          rgba(20, 12, 22, 0.62) 100%
        ),

        url("images/heavy-haul-login-bg1.png");


      background-size: cover;

      background-position: center center;

      background-repeat: no-repeat;

    }



    /* =====================================================
       PAGE LAYOUT
       ===================================================== */


    .login-page {

      width: 100%;

      height: 100vh;
      height: 100svh;

      display: flex;

      justify-content: flex-end;

      align-items: center;

      padding: 18px 4vw;

    }



    /* =====================================================
       LOGIN PANEL
       ===================================================== */


    .login-panel {

      width: min(375px, 92vw);

      padding: 18px 22px 17px;

      background: var(--plum-panel);

      border:
        1px solid
        rgba(245, 234, 214, 0.28);

      border-radius: 0;


      box-shadow:

        0 18px 45px
        rgba(0, 0, 0, 0.46),

        inset 0 1px 0
        rgba(255, 255, 255, 0.035);


      backdrop-filter: blur(5px);

      -webkit-backdrop-filter: blur(5px);

    }



    /* =====================================================
       BRAND
       ===================================================== */


    .brand-mark {

      text-align: center;

      margin-bottom: 8px;

    }


    .brand-symbol {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      height: 18px;

      margin-bottom: 4px;

      color: var(--walnut-light);

    }


    .brand-symbol .wing {

      font-size: 13px;

      letter-spacing: -1px;

      opacity: 0.85;

    }


    .brand-symbol .star {

      color: var(--pink);

      font-size: 17px;

      line-height: 1;

    }



    .brand-title {

      margin: 0;

      color: var(--cream);

      font-family:
        "Cinzel",
        serif;

      font-size: 29px;

      font-weight: 700;

      line-height: 1;

      letter-spacing: 2.5px;

    }



    .brand-command {

      display: block;

      margin-top: 5px;

      color: var(--lime);

      font-family:
        "Oswald",
        sans-serif;

      font-size: 21px;

      font-weight: 500;

      line-height: 1;

      letter-spacing: 8px;

    }



    .brand-subtitle {

      margin-top: 6px;

      color: var(--pink);

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 16px;

      font-style: italic;

      line-height: 1.1;

    }



    /* =====================================================
       WELCOME DIVIDER
       ===================================================== */


    .divider {

      display: flex;

      align-items: center;

      gap: 9px;

      margin: 12px 0 9px;

    }


    .divider::before,
    .divider::after {

      content: "";

      flex: 1;

      height: 1px;

      background:
        rgba(164, 138, 112, 0.55);

    }


    .divider span {

      color: var(--cream);

      font-family:
        "Oswald",
        sans-serif;

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 3px;

      white-space: nowrap;

      opacity: 0.82;

    }



    /* =====================================================
       FORM LABELS
       ===================================================== */


    .field-label {

      display: block;

      margin: 8px 0 4px;

      color: var(--cream);

      font-family:
        "Oswald",
        sans-serif;

      font-size: 11px;

      font-weight: 500;

      letter-spacing: 1.6px;

      text-transform: uppercase;

      opacity: 0.88;

    }



    /* =====================================================
       INDUSTRIAL INPUTS
       ===================================================== */


    .input-wrap {
      position: relative;
    }


    input[type="email"],
    input[type="password"] {

      width: 100%;

      height: 38px;

      padding: 8px 11px;

      background: var(--charcoal);

      color: var(--cream);


      border:
        1px solid
        rgba(164, 138, 112, 0.58);

      border-left:
        3px solid
        var(--walnut);

      border-radius: 0;


      font-family:
        "Inter",
        sans-serif;

      font-size: 13px;


      outline: none;


      box-shadow:

        inset 0 1px 3px
        rgba(0, 0, 0, 0.7);


      transition:

        border-color 0.18s ease,

        background 0.18s ease,

        box-shadow 0.18s ease;

    }


    input::placeholder {

      color: #8E858B;

    }


    input[type="email"]:focus,
    input[type="password"]:focus {

      background: #1D1B20;

      border-color: var(--walnut-light);

      border-left-color: var(--lime);


      box-shadow:

        inset 0 1px 3px
        rgba(0, 0, 0, 0.7),

        0 0 0 1px
        rgba(174, 188, 57, 0.15);

    }



    /* =====================================================
       LOGIN OPTIONS
       ===================================================== */


    .login-options {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      margin-top: 9px;

      font-size: 11px;

    }



    .remember {

      display: flex;

      align-items: center;

      gap: 6px;

      color: var(--stone);

      font-size: 11px;

      cursor: pointer;

    }


    .remember input {

      width: 14px;

      height: 14px;

      margin: 0;

      accent-color: var(--walnut);

    }



    /* =====================================================
       FORGOT PASSWORD
       ===================================================== */


    .forgot {

      color: var(--stone);

      font-family:
        "Inter",
        sans-serif;

      font-size: 11px;

      font-weight: 500;

      text-decoration: none;

      opacity: 0.82;


      transition:

        color 0.18s ease,

        opacity 0.18s ease;

    }


    .forgot:hover {

      color: var(--cream);

      opacity: 1;

    }



    /* =====================================================
       SIGN IN BUTTON
       ===================================================== */


    #signin {

      width: 100%;

      height: 38px;

      margin-top: 12px;

      padding: 0 14px;


      background: var(--walnut);

      color: var(--cream);


      border:
        1px solid
        var(--walnut-light);

      border-radius: 0;


      font-family:
        "Oswald",
        sans-serif;

      font-size: 13px;

      font-weight: 600;

      letter-spacing: 3.5px;


      cursor: pointer;


      box-shadow:

        inset 0 1px 0
        rgba(255, 255, 255, 0.10),

        0 4px 10px
        rgba(0, 0, 0, 0.25);


      transition:

        background 0.18s ease,

        border-color 0.18s ease,

        transform 0.12s ease,

        box-shadow 0.18s ease;

    }


    #signin:hover {

      background: #8A674C;

      border-color: #B89E83;


      box-shadow:

        inset 0 1px 0
        rgba(255, 255, 255, 0.12),

        0 6px 14px
        rgba(0, 0, 0, 0.30);

    }


    #signin:active {

      transform: translateY(1px);

    }


    #signin:disabled {

      cursor: wait;

      opacity: 0.72;

    }



    /* =====================================================
       SYSTEM OUTPUT
       ===================================================== */


    .out {

      margin-top: 11px;

      padding-top: 9px;


      border-top:

        1px solid
        rgba(164, 138, 112, 0.30);


      color: var(--stone);


      font-family:
        "Inter",
        sans-serif;

      font-size: 10.5px;

      line-height: 1.45;


      white-space: pre-wrap;

      word-break: break-word;

    }


    .out .bad {

      color: var(--danger);

    }


    .out .good {

      color: var(--success);

    }



    /* =====================================================
       OPEN COMMAND CENTER
       ===================================================== */


    .go {

      display: block;

      width: 100%;

      margin-top: 8px;

      padding: 8px 10px;


      background:
        rgba(122, 90, 66, 0.18);


      color: var(--cream);


      border:
        1px solid
        rgba(164, 138, 112, 0.55);


      font-family:
        "Oswald",
        sans-serif;

      font-size: 11px;

      font-weight: 500;

      letter-spacing: 1.5px;


      text-align: center;

      text-decoration: none;


      transition:

        background 0.18s ease,

        border-color 0.18s ease;

    }


    .go:hover {

      background:
        rgba(122, 90, 66, 0.34);

      border-color: var(--walnut-light);

    }



    /* =====================================================
       SMALLER LAPTOP SCREENS
       ===================================================== */


    @media (max-height: 720px) {

      .login-panel {

        padding:
          14px 20px;

      }


      .brand-title {

        font-size: 25px;

      }


      .brand-command {

        font-size: 18px;

        letter-spacing: 7px;

      }


      .brand-subtitle {

        font-size: 14px;

      }


      .brand-symbol {

        display: none;

      }


      .divider {

        margin:
          8px 0 6px;

      }


      .field-label {

        margin:
          6px 0 3px;

      }


      input[type="email"],
      input[type="password"] {

        height: 34px;

      }


      #signin {

        height: 35px;

        margin-top: 9px;

      }


      .out {

        margin-top: 8px;

        padding-top: 6px;

      }

    }



    /* =====================================================
       TABLET
       ===================================================== */


    @media (max-width: 900px) {

      body {

        background-position:
          38% center;

      }


      .login-page {

        justify-content: center;

        padding:
          16px;

      }

    }



    /* =====================================================
       PHONE
       ===================================================== */


    @media (max-width: 600px) {

      body {

        overflow: auto;

        background-position:
          35% center;

      }


      .login-page {

        min-height: 100svh;

        height: auto;

        justify-content: center;

        align-items: center;

        padding:
          14px;

      }


      .login-panel {

        width:
          min(360px, 94vw);

        padding:
          16px 18px;

      }


      .brand-title {

        font-size: 26px;

      }


      .brand-command {

        font-size: 19px;

        letter-spacing: 6px;

      }


      .brand-symbol {

        display: none;

      }

    }

  </style>

</head>


<body>


  <main class="login-page">


    <section class="login-panel">


      <!-- BRAND -->

      <div class="brand-mark">


        <div class="brand-symbol">

          <span class="wing">
            ━━
          </span>

          <span class="star">
            ★
          </span>

          <span class="wing">
            ━━
          </span>

        </div>


        <h1 class="brand-title">

          HEAVY HAUL

          <span class="brand-command">

            COMMAND

          </span>

        </h1>


        <div class="brand-subtitle">

          Dispatch Management System

        </div>


      </div>



      <!-- WELCOME -->

      <div class="divider">

        <span>
          WELCOME BACK
        </span>

      </div>



      <!-- EMAIL -->

      <label
        class="field-label"
        for="email"
      >

        Email

      </label>


      <div class="input-wrap">

        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="Enter your email"
        >

      </div>



      <!-- PASSWORD -->

      <label
        class="field-label"
        for="password"
      >

        Password

      </label>


      <div class="input-wrap">

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
        >

      </div>



      <!-- LOGIN OPTIONS -->

      <div class="login-options">


        <label class="remember">

          <input
            id="remember"
            type="checkbox"
          >

          Remember me

        </label>


        <a
          class="forgot"
          href="#"
          onclick="return false;"
        >

          Forgot password?

        </a>


      </div>



      <!-- SIGN IN -->

      <button
        id="signin"
        type="button"
      >

        SIGN IN

      </button>



      <!-- STATUS -->

      <div
        id="out"
        class="out"
      >

        Loading…

      </div>


    </section>


  </main>



  <!-- ==================================================
       SUPABASE
       ================================================== -->


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>



  <script>

    // ==================================================
    // SUPABASE CONNECTION
    // ==================================================


    const SUPABASE_URL =
      'https://zyhdatteglxozsgnjhrm.supabase.co';


    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5aGRhdHRlZ2x4b3pzZ25qaHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODEzMTAsImV4cCI6MjEwMDg1NzMxMH0.I4SlAWiqKk0oPv-0WRgVy_AAGnQ0NoT8-T8z62jIj7Y';



    // ==================================================
    // PAGE ELEMENTS
    // ==================================================


    const out =
      document.getElementById('out');


    const emailInput =
      document.getElementById('email');


    const passwordInput =
      document.getElementById('password');


    const signinButton =
      document.getElementById('signin');


    const rememberCheckbox =
      document.getElementById('remember');


    let db = null;



    // ==================================================
    // STATUS MESSAGE
    // ==================================================


    function log(text, cls) {

      const span =
        document.createElement('span');


      if (cls) {

        span.className =
          cls;

      }


      span.textContent =
        text + '\n';


      out.appendChild(span);

    }



    // ==================================================
    // JAVASCRIPT ERROR HANDLING
    // ==================================================


    window.onerror =
      function (msg) {

        log(
          'JS ERROR: ' + msg,
          'bad'
        );

      };



    out.textContent =
      '';



    // ==================================================
    // REMEMBER EMAIL
    // ==================================================


    const savedEmail =
      localStorage.getItem(
        'heavyHaulRememberedEmail'
      );


    if (savedEmail) {

      emailInput.value =
        savedEmail;


      rememberCheckbox.checked =
        true;

    }



    // ==================================================
    // STARTUP CHECKS
    // ==================================================


    if (
      typeof window.supabase ===
      'undefined'
    ) {


      log(
        'Unable to load sign-in service.',
        'bad'
      );


    }


    else if (
      SUPABASE_URL.indexOf(
        'YOUR-PROJECT-ID'
      ) !== -1
    ) {


      log(
        'Supabase URL has not been configured.',
        'bad'
      );


    }


    else if (
      SUPABASE_ANON_KEY.indexOf(
        'PASTE-YOUR'
      ) !== -1
    ) {


      log(
        'Supabase key has not been configured.',
        'bad'
      );


    }


    else if (
      SUPABASE_ANON_KEY.length <
      100
    ) {


      log(
        'Supabase key appears incomplete.',
        'bad'
      );


    }


    else {


      db =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );


      log(
        'System ready.',
        'good'
      );



      db.auth
        .getSession()
        .then(
          function (r) {


            if (
              r.data &&
              r.data.session
            ) {


              log(
                'Existing session found.',
                'good'
              );


              check();


            }

          }
        );

    }



    // ==================================================
    // SIGN IN
    // ==================================================


    signinButton
      .addEventListener(
        'click',
        function () {


          if (!db) {


            out.textContent =
              '';


            log(
              'Sign-in service is not ready.',
              'bad'
            );


            return;


          }



          const email =
            emailInput.value.trim();


          const password =
            passwordInput.value;



          if (!email) {


            out.textContent =
              '';


            log(
              'Please enter your email address.',
              'bad'
            );


            emailInput.focus();


            return;


          }



          if (!password) {


            out.textContent =
              '';


            log(
              'Please enter your password.',
              'bad'
            );


            passwordInput.focus();


            return;


          }



          if (
            rememberCheckbox.checked
          ) {


            localStorage.setItem(
              'heavyHaulRememberedEmail',
              email
            );


          }

          else {


            localStorage.removeItem(
              'heavyHaulRememberedEmail'
            );


          }



          out.textContent =
            '';


          log(
            'Signing in…'
          );



          signinButton.disabled =
            true;


          signinButton.textContent =
            'SIGNING IN…';



          db.auth
            .signInWithPassword({

              email:
                email,

              password:
                password

            })


            .then(
              function (r) {


                if (r.error) {


                  log(
                    'SIGN IN FAILED: ' +
                    r.error.message,
                    'bad'
                  );


                  return;


                }



                log(
                  'Signed in successfully.',
                  'good'
                );


                check();


              }
            )


            .catch(
              function (e) {


                log(
                  'NETWORK ERROR: ' +
                  e.message,
                  'bad'
                );


              }
            )


            .finally(
              function () {


                signinButton.disabled =
                  false;


                signinButton.textContent =
                  'SIGN IN';


              }
            );


        }
      );



    // ==================================================
    // ENTER KEY
    // ==================================================


    passwordInput
      .addEventListener(
        'keydown',
        function (e) {


          if (
            e.key ===
            'Enter'
          ) {


            signinButton.click();


          }


        }
      );



    emailInput
      .addEventListener(
        'keydown',
        function (e) {


          if (
            e.key ===
            'Enter'
          ) {


            passwordInput.focus();


          }


        }
      );



    // ==================================================
    // VERIFY USER AND DATABASE ACCESS
    // ==================================================


    function check() {


      db
        .from(
          'app_users'
        )


        .select(
          'full_name, role, tenant_id'
        )


        .then(
          function (r) {


            if (r.error) {


              log(
                'Profile error: ' +
                r.error.message,
                'bad'
              );


              return;


            }



            if (
              !r.data ||
              r.data.length === 0
            ) {


              log(
                'No application profile is linked to this login.',
                'bad'
              );


              return;


            }



            log(
              'Welcome, ' +
              r.data[0].full_name +
              '.',
              'good'
            );



            return db
              .from(
                'loads'
              )


              .select(
                '*',
                {
                  count:
                    'exact',

                  head:
                    true
                }
              );


          }
        )



        .then(
          function (r) {


            if (!r) {

              return;

            }



            if (r.error) {


              log(
                'Loads error: ' +
                r.error.message,
                'bad'
              );


            }

            else {


              log(
                'Loads available: ' +
                r.count,
                'good'
              );


            }



            return db
              .from(
                'v_fleet_board'
              )


              .select(
                '*',
                {
                  count:
                    'exact',

                  head:
                    true
                }
              );


          }
        )



        .then(
          function (r) {


            if (!r) {

              return;

            }



            if (r.error) {


              log(
                'Fleet board error: ' +
                r.error.message,
                'bad'
              );


              return;


            }



            log(
              'Command Center ready.',
              'good'
            );



            const a =
              document.createElement(
                'a'
              );


            a.href =
              'board.html';


            a.className =
              'go';


            a.textContent =
              'OPEN COMMAND CENTER';


            out.appendChild(a);


          }
        )



        .catch(
          function (e) {


            log(
              'ERROR: ' +
              e.message,
              'bad'
            );


          }
        );


    }


  </script>


</body>

</html>
