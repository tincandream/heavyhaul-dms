<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch — Sign in</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#22221f; --muted:#73726c;
          --line:#e2e0da; --accent:#185fa5; --danger:#a32d2d; --ok:#0f6e56; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font:15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
         display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:26px; width:100%; max-width:440px; }
  h1 { font-size:19px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 5px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line);
          border-radius:8px; font-size:15px; }
  button { width:100%; margin-top:18px; padding:11px; border:0; border-radius:8px;
           background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  .out { margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
         font-size:12.5px; font-family:ui-monospace,Consolas,monospace;
         color:var(--muted); white-space:pre-wrap; word-break:break-word; }
  .out .bad { color:var(--danger); }
  .out .good { color:var(--ok); }
  .go { display:inline-block; margin-top:14px; color:var(--accent);
        font-size:14px; font-family:system-ui,sans-serif; }
</style>
</head>
<body>
<div class="card">
  <h1>Heavy Haul Dispatch</h1>
  <p class="sub">Sign in to the command center</p>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" value="diannavmwaka@gmail.com">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">

  <button id="signin">Sign in</button>

  <div id="out" class="out">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== FILL IN THESE TWO VALUES =====
const SUPABASE_URL = 'https://zyhdatteglxozsgnjhrm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5aGRhdHRlZ2x4b3pzZ25qaHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODEzMTAsImV4cCI6MjEwMDg1NzMxMH0.I4SlAWiqKk0oPv-0WRgVy_AAGnQ0NoT8-T8z62jIj7Y';
// ====================================

const out = document.getElementById('out');
let db = null;

function log(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text + '\n';
  out.appendChild(span);
}

// Catch anything that throws, so nothing ever hangs silently
window.onerror = function (msg) { log('JS ERROR: ' + msg, 'bad'); };

out.textContent = '';

// --- Startup checks ---
if (typeof window.supabase === 'undefined') {
  log('FAIL: Supabase library did not load from the CDN.', 'bad');
  log('Check your internet connection, then reload.');
} else if (SUPABASE_URL.indexOf('YOUR-PROJECT-ID') !== -1) {
  log('FAIL: SUPABASE_URL is still the placeholder.', 'bad');
  log('Edit this file and paste your Project URL.');
} else if (SUPABASE_ANON_KEY.indexOf('PASTE-YOUR') !== -1) {
  log('FAIL: SUPABASE_ANON_KEY is still the placeholder.', 'bad');
  log('Edit this file and paste your anon public key.');
} else if (SUPABASE_ANON_KEY.length < 100) {
  log('FAIL: anon key is only ' + SUPABASE_ANON_KEY.length +
      ' characters — it should be around 200.', 'bad');
  log('It was truncated when copied. Paste it again.');
} else {
  log('Library loaded.', 'good');
  log('URL: ' + SUPABASE_URL);
  log('Key length: ' + SUPABASE_ANON_KEY.length + ' characters');
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  log('Client ready. Enter your password and sign in.', 'good');
  db.auth.getSession().then(function (r) {
    if (r.data && r.data.session) { log('Existing session found.'); check(); }
  });
}

// --- Sign in ---
document.getElementById('signin').addEventListener('click', function () {
  if (!db) { log('Cannot sign in — see the errors above.', 'bad'); return; }

  out.textContent = '';
  log('Attempting sign in…');

  db.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  }).then(function (r) {
    if (r.error) { log('SIGN IN FAILED: ' + r.error.message, 'bad'); return; }
    log('Signed in as ' + r.data.user.email, 'good');
    check();
  }).catch(function (e) {
    log('NETWORK ERROR: ' + e.message, 'bad');
  });
});

document.getElementById('password').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('signin').click();
});

// --- Verify RLS and data access ---
function check() {
  db.from('app_users').select('full_name, role, tenant_id').then(function (r) {
    if (r.error) { log('app_users error: ' + r.error.message, 'bad'); return; }
    if (!r.data || r.data.length === 0) {
      log('PROBLEM: no app_users row linked to this login.', 'bad');
      log('Every query returns empty until that is fixed.');
      return;
    }
    log('Profile: ' + r.data[0].full_name + ' (' + r.data[0].role + ')', 'good');
    log('Tenant: ' + r.data[0].tenant_id);

    return db.from('loads').select('*', { count: 'exact', head: true });
  }).then(function (r) {
    if (!r) return;
    log(r.error ? ('loads error: ' + r.error.message) : ('Loads visible: ' + r.count),
        r.error ? 'bad' : 'good');
    return db.from('v_fleet_board').select('*', { count: 'exact', head: true });
  }).then(function (r) {
    if (!r) return;
    log(r.error ? ('fleet board error: ' + r.error.message)
                : ('Fleet board rows: ' + r.count),
        r.error ? 'bad' : 'good');

    const a = document.createElement('a');
    a.href = 'board.html';
    a.className = 'go';
    a.textContent = 'Open Fleet Board →';
    out.appendChild(a);
  }).catch(function (e) {
    log('ERROR: ' + e.message, 'bad');
  });
}
</script>
</body>
</html>
