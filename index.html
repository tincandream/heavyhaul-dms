<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Heavy Haul Command — Sign In</title>

<style>
:root {
  --cream: #f5ead6;
  --plum: #241a2a;
  --plum-soft: rgba(28, 19, 33, 0.94);
  --pink: #d94b7b;
  --green: #aebc39;
  --muted: #b9adb8;
  --line: rgba(245, 234, 214, 0.25);
  --danger: #ff6b7a;
  --ok: #aebc39;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: var(--cream);

  background:
    linear-gradient(
      90deg,
      rgba(18, 10, 22, 0.10) 0%,
      rgba(18, 10, 22, 0.18) 48%,
      rgba(18, 10, 22, 0.65) 100%
    ),
    url("images/heavy-haul-login-bg.jpg");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.login-page {
  min-height: 100vh;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 48px 6vw;
}

.login-panel {
  width: min(500px, 100%);
  padding: 42px 42px 36px;

  background: var(--plum-soft);

  border: 1px solid rgba(245, 234, 214, 0.65);
  border-radius: 28px;

  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.45);

  backdrop-filter: blur(9px);
}

.brand-mark {
  text-align: center;
  margin-bottom: 28px;
}

.brand-star {
  color: var(--pink);
  font-size: 28px;
  margin-bottom: 6px;
}

.brand-mark h1 {
  margin: 0;

  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(38px, 5vw, 58px);
  line-height: 0.95;
  letter-spacing: 3px;

  color: var(--cream);
}

.brand-mark .command {
  display: block;
  margin-top: 10px;

  color: var(--green);

  font-family:
    "Arial Narrow",
    "Roboto Condensed",
    sans-serif;

  font-size: 0.82em;
  letter-spacing: 9px;
}

.brand-mark .subtitle {
  margin-top: 14px;

  color: var(--pink);

  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: 18px;
}

.divider {
  display: flex;
  align-items: center;
  gap: 16px;

  margin: 28px 0 22px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--pink)
  );
}

.divider::after {
  background: linear-gradient(
    90deg,
    var(--pink),
    transparent
  );
}

.divider span {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 4px;
  white-space: nowrap;
}

label {
  display: block;
  margin: 16px 0 7px;

  color: var(--cream);
  font-size: 14px;
}

input[type="email"],
input[type="password"] {
  width: 100%;
  padding: 15px 16px;

  border: 1px solid rgba(245, 234, 214, 0.35);
  border-radius: 8px;

  background: rgba(20, 15, 25, 0.60);

  color: white;
  font-size: 16px;

  outline: none;

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

input::placeholder {
  color: #9c919b;
}

input:focus {
  border-color: var(--pink);

  box-shadow:
    0 0 0 3px rgba(217, 75, 123, 0.15);
}

.login-options {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-top: 18px;

  font-size: 14px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 8px;
}

.remember input {
  accent-color: var(--green);
}

.forgot {
  color: var(--pink);
  text-decoration: none;
}

.forgot:hover {
  text-decoration: underline;
}

#signin {
  width: 100%;

  margin-top: 26px;
  padding: 16px;

  border: 0;
  border-radius: 8px;

  background: var(--green);
  color: var(--plum);

  font-size: 17px;
  font-weight: 800;
  letter-spacing: 4px;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    filter 0.15s ease;
}

#signin:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

#signin:active {
  transform: translateY(0);
}

.out {
  margin-top: 20px;
  padding-top: 18px;

  border-top: 1px solid var(--line);

  color: var(--muted);
  font-size: 12.5px;

  font-family:
    ui-monospace,
    Consolas,
    monospace;

  white-space: pre-wrap;
  word-break: break-word;
}

.out .bad {
  color: var(--danger);
}

.out .good {
  color: var(--ok);
}

.go {
  display: inline-block;

  margin-top: 14px;

  color: var(--pink);
  font-size: 14px;
  font-family: system-ui, sans-serif;

  text-decoration: none;
}

.go:hover {
  text-decoration: underline;
}

.tagline {
  margin-top: 26px;

  text-align: center;

  color: var(--cream);

  font-size: 12px;
  font-weight: 600;
  letter-spacing: 3px;
}

.tagline span {
  color: var(--pink);
}

@media (max-width: 800px) {

  body {
    background-position: 42% center;
  }

  .login-page {
    justify-content: center;
    align-items: flex-end;

    padding: 22px;
  }

  .login-panel {
    padding: 30px 24px;
    border-radius: 22px;
  }

  .brand-mark h1 {
    font-size: 38px;
  }

  .brand-mark .command {
    letter-spacing: 6px;
  }

  .login-options {
    gap: 12px;
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>

<main class="login-page">

  <section class="login-panel">

    <div class="brand-mark">

      <div class="brand-star">
        ★
      </div>

      <h1>
        HEAVY HAUL
        <span class="command">
          COMMAND
        </span>
      </h1>

      <div class="subtitle">
        Dispatch Management System
      </div>

    </div>


    <div class="divider">
      <span>WELCOME BACK</span>
    </div>


    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="Enter your email"
    >


    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Enter your password"
    >


    <div class="login-options">

      <label class="remember">
        <input type="checkbox">
        Remember me
      </label>

      <a
        class="forgot"
        href="#"
      >
        Forgot password?
      </a>

    </div>


    <button id="signin">
      SIGN IN →
    </button>


    <div id="out" class="out">
      Loading…
    </div>


    <div class="tagline">
      COMMAND <span>•</span>
      CONTROL <span>•</span>
      DELIVER
    </div>

  </section>

</main>
