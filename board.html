<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Board — Heavy Haul Dispatch</title>
<style>
  :root {
    --bg:#f5f4f0; --card:#fff; --ink:#22221f; --muted:#73726c; --faint:#9c9a92;
    --line:#e2e0da; --accent:#185fa5; --accent-bg:#e8f0f8;
    --danger:#a32d2d; --danger-bg:#fcebeb;
    --warn:#8a5a12;   --warn-bg:#fdf2e0;
    --ok:#0f6e56;     --ok-bg:#e1f5ee;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line);
           padding:14px 20px; display:flex; align-items:center;
           gap:14px; flex-wrap:wrap; }
  header h1 { font-size:16px; font-weight:600; margin:0; }
  .who { font-size:12.5px; color:var(--muted); margin-left:auto; }
  .who button { margin-left:10px; padding:5px 11px; font-size:12.5px;
                border:1px solid var(--line); background:var(--card);
                color:var(--muted); border-radius:6px; cursor:pointer; }
  main { padding:18px 20px 40px; max-width:1500px; margin:0 auto; }

  .widgets { display:grid; gap:10px; margin-bottom:18px;
             grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
  .w { background:var(--card); border:1px solid var(--line);
       border-radius:10px; padding:12px 14px; }
  .w .n { font-size:22px; font-weight:600; line-height:1.2; }
  .w .l { font-size:11.5px; color:var(--muted); text-transform:uppercase;
          letter-spacing:.4px; margin-top:2px; }
  .w.alert .n { color:var(--danger); }
  .w.warn  .n { color:var(--warn); }

  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center;
         margin-bottom:14px; }
  .bar input, .bar select {
    padding:7px 10px; font-size:13px; border:1px solid var(--line);
    border-radius:7px; background:var(--card); color:var(--ink); }
  .bar input { min-width:190px; }
  .bar .count { font-size:12.5px; color:var(--muted); margin-left:auto; }

  .tablewrap { background:var(--card); border:1px solid var(--line);
               border-radius:10px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:1080px; }
  th { text-align:left; font-size:11px; font-weight:500; color:var(--faint);
       text-transform:uppercase; letter-spacing:.4px;
       padding:11px 12px; border-bottom:1px solid var(--line);
       white-space:nowrap; cursor:pointer; user-select:none; }
  th:hover { color:var(--ink); }
  th .arrow { color:var(--accent); }
  td { padding:11px 12px; border-bottom:1px solid var(--line);
       vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#faf9f6; }

  .unit { font-weight:600; }
  .sub { font-size:12px; color:var(--muted); margin-top:1px; }
  .lnum { color:var(--accent); font-weight:500; }
  .pill { display:inline-block; padding:2px 9px; border-radius:11px;
          font-size:12px; white-space:nowrap; }
  .pill.ok     { background:var(--ok-bg);     color:var(--ok); }
  .pill.go     { background:var(--accent-bg); color:var(--accent); }
  .pill.warn   { background:var(--warn-bg);   color:var(--warn); }
  .pill.bad    { background:var(--danger-bg); color:var(--danger); }
  .pill.idle   { background:var(--bg); color:var(--muted);
                 border:1px solid var(--line); }
  .frac { font-variant-numeric:tabular-nums; font-size:13px; }
  .frac.ok   { color:var(--ok); }
  .frac.warn { color:var(--warn); }
  .frac.bad  { color:var(--danger); }
  .frac.none { color:var(--faint); }
