<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="theme.css">

<title>Load Workspace — Heavy Haul DMS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#22221f; --muted:#73726c;
          --line:#e2e0da; --line2:#cfccc4; --accent:#185fa5;
          --danger:#a32d2d; --dangerbg:#fcebeb; --warn:#8a5a10; --warnbg:#fdf3e3;
          --ok:#0f6e56; --okbg:#e4f4ee; --accentbg:#e7f0f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { padding:18px; max-width:1400px; margin:0 auto 40px; }

  .tiles { display:grid; gap:10px; margin-bottom:18px;
           grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .tile { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:12px 14px; }
  .tile .n { font-size:22px; font-weight:600; line-height:1.2; }
  .tile .l { font-size:12px; color:var(--muted); margin-top:2px; }
  .tile.alert .n { color:var(--danger); }

  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center;
         margin-bottom:12px; }
  select, .search { padding:7px 10px; border:1px solid var(--line2);
                    border-radius:7px; font-size:13px; background:var(--card);
                    color:var(--ink); font-family:inherit; }
  .search { min-width:190px; }
  .count { font-size:12.5px; color:var(--muted); margin-left:auto; }

  .wrap { background:var(--card); border:1px solid var(--line);
          border-radius:10px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:1080px; }
  th { text-align:left; font-size:11.5px; font-weight:500; color:var(--muted);
       padding:10px 12px; border-bottom:1px solid var(--line);
       white-space:nowrap; cursor:pointer; user-select:none; }
  th:hover { color:var(--ink); }
  td { padding:11px 12px; border-bottom:1px solid var(--line);
       vertical-align:top; font-size:13px; }
  tr:last-child td { border-bottom:0; }
  tr.row { cursor:pointer; }
  tr.row:hover { background:#faf9f6; }
  .sub2 { font-size:11.5px; color:var(--muted); }
  .unit { font-weight:600; }
  .ldnum { color:var(--accent); font-weight:500; }

  .pill { display:inline-block; padding:2px 8px; border-radius:11px;
          font-size:11.5px; white-space:nowrap; }
  .p-red { background:var(--dangerbg); color:var(--danger); }
  .p-amb { background:var(--warnbg); color:var(--warn); }
  .p-blu { background:var(--accentbg); color:var(--accent); }
  .p-grn { background:var(--okbg); color:var(--ok); }
  .p-gry { background:#f0efeb; color:var(--muted); border:1px solid var(--line); }

  .frac { font-variant-numeric:tabular-nums; font-size:13px; }
  .f-ok { color:var(--ok); } .f-warn { color:var(--warn); }
  .f-bad { color:var(--danger); } .f-non { color:var(--muted); }
  .stale { color:var(--warn); font-size:11.5px; }
  .verystale { color:var(--danger); font-size:11.5px; }
  .act { font-size:12.5px; }
  .act.need { color:var(--danger); }
  .crit { border-left:3px solid var(--danger); }
  .msg { padding:26px; text-align:center; color:var(--muted); font-size:13px; }
  .msg.bad { color:var(--danger); }
</style>
</head>
<body>

<header></header>

<main>
  <div class="tiles" id="tiles"></div>

  <div class="bar">
    <input class="search" id="q" placeholder="Search truck, driver, load…">
    <select id="fstatus"><option value="">All statuses</option></select>
    <select id="fdriver"><option value="">All drivers</option></select>
    <select id="fbroker"><option value="">All brokers</option></select>
    <select id="fstate"><option value="">All states</option></select>
    <span class="count" id="count"></span>
  </div>

  <div class="wrap">
    <table>
      <thead><tr>
        <th data-k="truck_number">Truck</th>
        <th data-k="driver_name">Driver</th>
        <th data-k="load_number">Load</th>
        <th data-k="display_status">Status</th>
        <th data-k="current_location_text">Location</th>
        <th data-k="destination">Destination</th>
        <th data-k="next_event_at">Next event</th>
        <th data-k="permits_open">Prm</th>
        <th data-k="escorts_total">Esc</th>
        <th data-k="next_action">Next action</th>
      </tr></thead>
      <tbody id="body"><tr><td colspan="10" class="msg">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nav.js"></script>
<script>
// ===== FILL IN THESE TWO VALUES =====
const SUPABASE_URL = 'https://zyhdatteglxozsgnjhrm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5aGRhdHRlZ2x4b3pzZ25qaHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODEzMTAsImV4cCI6MjEwMDg1NzMxMH0.I4SlAWiqKk0oPv-0WRgVy_AAGnQ0NoT8-T8z62jIj7Y';
// ====================================

const $ = id => document.getElementById(id);
let db = null, rows = [], sortKey = null, sortDir = 1;

function fail(text) {
  $('body').innerHTML = '<tr><td colspan="10" class="msg bad">' + text + '</td></tr>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

window.onerror = m => fail('JS error: ' + m);

if (typeof window.supabase === 'undefined') {
  fail('Supabase library did not load. Check your connection and reload.');
} else if (SUPABASE_URL.indexOf('YOUR-PROJECT-ID') !== -1 ||
           SUPABASE_ANON_KEY.indexOf('PASTE-YOUR') !== -1) {
  fail('Edit board.html and fill in SUPABASE_URL and SUPABASE_ANON_KEY.');
} else {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  start();
}

async function start() {
  const s = await db.auth.getSession();
  if (!s.data.session) { location.href = 'index.html'; return; }

  const t = await buildNav(db, 'Fleet Board');
  if (!t) { fail('No app_users row linked to this login.'); return; }

  load();
  setInterval(load, 60000);
}

async function load() {
  const r = await db.from('v_fleet_board')
    .select('*')
    .order('attention_rank')
    .order('next_event_at', { nullsFirst: false });

  if (r.error) { fail('Fleet board query failed: ' + r.error.message); return; }

  rows = r.data || [];
  const st = $('stamp');
  if (st) st.textContent = 'updated ' +
    new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  fillFilters();
  tiles();
  render();
}

function uniq(key) {
  return [...new Set(rows.map(r => r[key]).filter(Boolean))].sort();
}

function fillFilters() {
  const map = { fstatus:'display_status', fdriver:'driver_name',
                fbroker:'broker_name', fstate:'current_state' };
  for (const id in map) {
    const sel = $(id), keep = sel.value, first = sel.options[0].textContent;
    sel.innerHTML = '<option value="">' + first + '</option>' +
      uniq(map[id]).map(v =>
        '<option value="'+esc(v)+'">'+esc(pretty(v))+'</option>').join('');
    sel.value = keep;
  }
}

function pretty(s) {
  if (!s) return '';
  return String(s).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
}

function tiles() {
  const t = [
    ['Active loads', rows.filter(r => r.load_id).length, false],
    ['Available trucks', rows.filter(r => !r.load_id).length, false],
    ['On hold', rows.filter(r => r.hold_reason).length,
      rows.some(r => r.hold_reason)],
    ['Waiting on permits', rows.filter(r => r.permits_open > 0).length,
      rows.some(r => r.permits_open > 0)],
    ['Escorts unbooked',
      rows.filter(r => r.escorts_total > r.escorts_confirmed).length, false],
    ['Stale check-ins',
      rows.filter(r => r.check_in_age_min > 480).length,
      rows.some(r => r.check_in_age_min > 480)]
  ];
  $('tiles').innerHTML = t.map(([label, n, alert]) =>
    '<div class="tile' + (alert && n > 0 ? ' alert' : '') + '">' +
    '<div class="n">' + n + '</div><div class="l">' + label + '</div></div>'
  ).join('');
}

function statusPill(r) {
  const s = r.display_status || '';
  let cls = 'p-gry';
  if (['breakdown','accident','road_closure'].includes(s)) cls = 'p-red';
  else if (r.hold_reason) cls = 'p-amb';
  else if (['in_transit','loaded','dispatched','en_route_to_pickup'].includes(s)) cls = 'p-blu';
  else if (['delivered','pod_pending','unloading'].includes(s)) cls = 'p-grn';
  else if (['loading','at_shipper','at_receiver','at_weigh_station',
            'under_inspection'].includes(s)) cls = 'p-amb';
  let html = '<span class="pill ' + cls + '">' + pretty(s) + '</span>';
  if (r.hold_reason && r.load_status)
    html += '<div class="sub2">was ' + pretty(r.load_status) + '</div>';
  return html;
}

function frac(done, total) {
  if (!total) return '<span class="frac f-non">—</span>';
  const cls = done === total ? 'f-ok' : (done === 0 ? 'f-bad' : 'f-warn');
  return '<span class="frac ' + cls + '">' + done + '/' + total + '</span>';
}

function when(iso) {
  if (!iso) return '<span class="sub2">—</span>';
  const d = new Date(iso);
  return d.toLocaleDateString([], {month:'numeric', day:'numeric'}) + ' ' +
         d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}

function age(min) {
  if (min == null) return '';
  const m = Math.round(min);
  const txt = m < 60 ? m + 'm ago' : Math.round(m/60) + 'h ago';
  const cls = m > 480 ? 'verystale' : (m > 240 ? 'stale' : 'sub2');
  return '<div class="' + cls + '">' + txt + '</div>';
}

function render() {
  const q = $('q').value.toLowerCase().trim();
  let list = rows.filter(r => {
    if ($('fstatus').value && r.display_status !== $('fstatus').value) return false;
    if ($('fdriver').value && r.driver_name !== $('fdriver').value) return false;
    if ($('fbroker').value && r.broker_name !== $('fbroker').value) return false;
    if ($('fstate').value && r.current_state !== $('fstate').value) return false;
    if (q) {
      const hay = [r.truck_number, r.driver_name, r.load_number, r.broker_name,
                   r.current_location_text, r.destination]
                  .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (sortKey) {
    list.sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (x == null) return 1;
      if (y == null) return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
    });
  }

  $('count').textContent = list.length + ' of ' + rows.length + ' trucks';

  if (!list.length) {
    $('body').innerHTML = '<tr><td colspan="10" class="msg">No trucks match.</td></tr>';
    return;
  }

  $('body').innerHTML = list.map(r => {
    const needs = r.next_action && r.next_action !== 'On track';
    return '<tr class="row' + (r.priority === 'critical' ? ' crit' : '') + '"' +
      (r.load_id ? ' data-load="' + r.load_id + '"' : '') + '>' +
      '<td><span class="unit">' + esc(r.truck_number || '') + '</span>' +
        (r.trailer_type ? '<div class="sub2">' + pretty(r.trailer_type) +
          (r.trailer_number ? ' ' + esc(r.trailer_number) : '') + '</div>' : '') + '</td>' +
      '<td>' + (r.driver_name ? esc(r.driver_name) : '<span class="sub2">unassigned</span>') +
        (r.driver_hours_remaining_min != null
          ? '<div class="sub2">' + Math.floor(r.driver_hours_remaining_min/60) +
            'h ' + (r.driver_hours_remaining_min%60) + 'm HOS</div>' : '') + '</td>' +
      '<td>' + (r.load_number
          ? '<span class="ldnum">' + esc(r.load_number) + '</span>' +
            (r.broker_name ? '<div class="sub2">' + esc(r.broker_name) + '</div>' : '')
          : '<span class="sub2">—</span>') + '</td>' +
      '<td>' + statusPill(r) + '</td>' +
      '<td>' + (r.current_location_text ? esc(r.current_location_text)
                                        : '<span class="sub2">—</span>') +
        age(r.check_in_age_min) + '</td>' +
      '<td>' + (r.destination ? esc(r.destination) : '<span class="sub2">—</span>') + '</td>' +
      '<td>' + when(r.next_event_at) +
        (r.next_event_label ? '<div class="sub2">' + r.next_event_label + '</div>' : '') +
        '</td>' +
      '<td>' + frac(r.permits_issued, r.permits_total) +
        (r.has_window_conflict ? '<div class="verystale">window</div>' : '') + '</td>' +
      '<td>' + frac(r.escorts_confirmed, r.escorts_total) + '</td>' +
      '<td><span class="act' + (needs ? ' need' : '') + '">' +
        esc(r.next_action || '') + '</span></td>' +
      '</tr>';
  }).join('');
}

['q','fstatus','fdriver','fbroker','fstate'].forEach(id => {
  $(id).addEventListener('input', render);
  $(id).addEventListener('change', render);
});

document.querySelectorAll('th[data-k]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
    render();
  });
});

$('body').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-load]');
  if (tr) location.href = 'workspace.html?id=' + tr.dataset.load;
});
</script>
</body>
</html>
