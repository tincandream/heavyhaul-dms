<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Loads · Heavy Haul DMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --ink:#1c2128; --muted:#6b7280;
    --accent:#1f4e79; --good:#166534; --bad:#991b1b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header nav a{color:#cfe0f0;text-decoration:none;margin-right:14px;font-size:14px}
  header nav a:hover,header nav a.on{color:#fff}
  .wrap{max-width:1400px;margin:0 auto;padding:20px}
  #tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  @media(max-width:760px){#tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;
        cursor:pointer;text-align:left;font:inherit;color:inherit}
  .tile:hover{border-color:var(--accent)}
  .tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .tile .n{font-size:28px;font-weight:700;line-height:1.1}
  .tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .bar input,.bar select,.bar button{padding:9px 11px;border:1px solid var(--line);
        border-radius:8px;background:#fff;font:inherit;color:inherit}
  .bar input[type=search]{flex:1;min-width:220px}
  .bar button{cursor:pointer}
  .bar button:hover{border-color:var(--accent)}
  .tblwrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  th{background:#eef1f5;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
     color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0}
  th .ar{opacity:.35;font-size:10px;margin-left:4px}
  th.sorted .ar{opacity:1}
  tbody tr:hover{background:#f8fafc;cursor:pointer}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:#eef1f5;text-transform:capitalize}
  .pill.active{background:#dbeafe;color:#1e40af}
  .pill.pipeline{background:#fef3c7;color:#92400e}
  .pill.completed{background:#dcfce7;color:#166534}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .msg{padding:28px;text-align:center;color:var(--muted)}
  .err{background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px;margin-bottom:14px;
       white-space:pre-wrap;font-size:14px}
  a.ref{color:var(--accent);font-weight:600;text-decoration:none}
  a.ref:hover{text-decoration:underline}
  .count{color:var(--muted);font-size:13px;margin:10px 2px 0}
</style>
</head>
<body>

<header>
  <h1>Heavy Haul DMS</h1>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="loads.html" class="on">Loads</a>
    <a href="customers.html">Customers</a>
    <a href="carriers.html">Carriers</a>
  </nav>
</header>

<div class="wrap">
  <div id="err" class="err" hidden></div>

  <div id="tiles"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="Search load #, customer, city, commodity…" autocomplete="off">
    <select id="statusFilter"><option value="">All statuses</option></select>
    <button id="reset" type="button">Reset</button>
  </div>

  <div class="tblwrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"><tr><td class="msg" colspan="9">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="count" id="count"></div>
</div>

<script>
/* ============ CREDENTIALS — paste yours here ============ */
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============ CONFIG — adjust to your schema ============ */
const CFG = {
  table: 'loads',
  marginView: 'v_load_margin',
  marginKey: 'load_id',          // column in v_load_margin that points back to loads.id
  buckets: {
    pipeline:  ['quote','quoted','pending','booked','planning','tendered','permit_pending','awaiting_permits'],
    active:    ['dispatched','assigned','in_transit','en_route','at_pickup','at_delivery','loading','unloading','on_hold'],
    completed: ['delivered','completed','invoiced','paid','closed']
  }
};
// Any status not listed above falls into "pipeline" — see bucketOf().

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function firstOf(row, names){
  if(!row) return null;
  for(const n of names){
    if(row[n] !== undefined && row[n] !== null && row[n] !== '') return row[n];
  }
  return null;
}
function num(v){
  if(v === null || v === undefined || v === '') return null;
  const n = Number(String(v).replace(/[$,]/g,''));
  return Number.isFinite(n) ? n : null;
}
const money = v => v == null ? '—' :
  (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:0});
const dt = v => {
  if(!v) return '—';
  const d = new Date(v);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'});
};
function bucketOf(status){
  const s = String(status || '').toLowerCase().trim().replace(/[\s-]+/g,'_');
  for(const b in CFG.buckets){ if(CFG.buckets[b].includes(s)) return b; }
  return 'pipeline';
}
function place(r, prefix){
  const c = firstOf(r,[prefix+'_city']), s = firstOf(r,[prefix+'_state']);
  if(c || s) return [c,s].filter(Boolean).join(', ');
  return firstOf(r,[prefix, prefix+'_location', prefix+'_address']);
}

/* ============ normalize one row ============ */
function norm(r, m){
  const status = firstOf(r,['status','load_status','stage','state']) || '';
  return {
    id:        r.id,
    ref:       firstOf(r,['load_number','load_no','reference','ref_number','ref','order_number']) || r.id,
    customer:  firstOf(r,['customer_name','customer','shipper_name','shipper','bill_to','broker']) || '—',
    origin:    place(r,'origin') || place(r,'pickup') || place(r,'pu') || '—',
    dest:      place(r,'destination') || place(r,'dest') || place(r,'delivery') || '—',
    commodity: firstOf(r,['commodity','equipment','description','freight']) || '—',
    pickup:    firstOf(r,['pickup_date','pu_date','ship_date','start_date','pickup_at']),
    rate:      num(firstOf(r,['customer_rate','rate','total_rate','linehaul','revenue','quoted_rate'])),
    margin:    m ? num(firstOf(m,['margin','gross_margin','net_margin','profit','margin_amount'])) : null,
    marginPct: m ? num(firstOf(m,['margin_pct','margin_percent','gross_margin_pct','margin_percentage'])) : null,
    status, bucket: bucketOf(status)
  };
}

/* ============ columns ============ */
const COLS = [
  {k:'ref',      label:'Load #',      cell:d=>`<a class="ref" href="workspace.html?id=${encodeURIComponent(d.id)}">${esc(d.ref)}</a>`},
  {k:'customer', label:'Customer',    cell:d=>esc(d.customer)},
  {k:'origin',   label:'Origin',      cell:d=>esc(d.origin)},
  {k:'dest',     label:'Destination', cell:d=>esc(d.dest)},
  {k:'commodity',label:'Commodity',   cell:d=>esc(d.commodity)},
  {k:'pickup',   label:'Pickup',      cell:d=>dt(d.pickup)},
  {k:'status',   label:'Status',      cell:d=>`<span class="pill ${d.bucket}">${esc(String(d.status||'—').replace(/_/g,' '))}</span>`},
  {k:'rate',     label:'Rate',        cls:'num', cell:d=>money(d.rate)},
  {k:'margin',   label:'Margin',      cls:'num', cell:d=>d.margin==null ? '—' :
      `<span class="${d.margin<0?'neg':'pos'}">${money(d.margin)}${d.marginPct!=null?' · '+Math.round(d.marginPct)+'%':''}</span>`}
];

/* ============ state ============ */
let ROWS = [];
const view = { tile:'total', q:'', status:'', sort:'pickup', dir:-1 };

/* ============ tiles ============ */
function tiles(){
  const c = { total: ROWS.length, active:0, pipeline:0, completed:0 };
  ROWS.forEach(d => { c[d.bucket] = (c[d.bucket]||0) + 1; });

  const defs = [
    ['total','Total Loads'], ['active','Active'],
    ['pipeline','Pipeline'], ['completed','Completed']
  ];

  $('#tiles').innerHTML = defs.map(([k,label]) =>
    `<button class="tile${view.tile===k?' on':''}" data-tile="${k}" type="button">
       <div class="n">${c[k]||0}</div><div class="l">${label}</div>
     </button>`).join('');

  $('#tiles').querySelectorAll('.tile').forEach(el => {
    el.onclick = () => { view.tile = el.dataset.tile; render(); };
  });
}

/* ============ filter + sort + render ============ */
function visible(){
  const q = view.q.toLowerCase().trim();
  return ROWS.filter(d => {
    if(view.tile !== 'total' && d.bucket !== view.tile) return false;
    if(view.status && String(d.status) !== view.status) return false;
    if(q){
      const hay = [d.ref,d.customer,d.origin,d.dest,d.commodity,d.status].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    let x = a[view.sort], y = b[view.sort];
    if(view.sort === 'pickup'){ x = x ? Date.parse(x) : -Infinity; y = y ? Date.parse(y) : -Infinity; }
    if(x == null) x = -Infinity;
    if(y == null) y = -Infinity;
    if(typeof x === 'number' && typeof y === 'number') return (x - y) * view.dir;
    return String(x).localeCompare(String(y), 'en', {numeric:true}) * view.dir;
  });
}

function head(){
  $('#head').innerHTML = COLS.map(c =>
    `<th data-k="${c.k}" class="${c.cls||''}${view.sort===c.k?' sorted':''}">${c.label}<span class="ar">${
      view.sort===c.k ? (view.dir===1?'▲':'▼') : '◆'}</span></th>`).join('');

  $('#head').querySelectorAll('th').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.k;
      if(view.sort === k){ view.dir = -view.dir; }
      else { view.sort = k; view.dir = (k==='pickup'||k==='rate'||k==='margin') ? -1 : 1; }
      render();
    };
  });
}

function render(){
  tiles(); head();
  const list = visible();
  const tb = $('#rows');

  if(!list.length){
    tb.innerHTML = `<tr><td class="msg" colspan="${COLS.length}">No loads match these filters.</td></tr>`;
  } else {
    tb.innerHTML = list.map(d =>
      `<tr data-id="${esc(d.id)}">${COLS.map(c =>
        `<td class="${c.cls||''}">${c.cell(d)}</td>`).join('')}</tr>`).join('');

    tb.querySelectorAll('tr').forEach(tr => {
      tr.onclick = e => {
        if(e.target.closest('a')) return;
        location.href = 'workspace.html?id=' + encodeURIComponent(tr.dataset.id);
      };
    });
  }
  $('#count').textContent = `Showing ${list.length} of ${ROWS.length} loads`;
}

function statusOptions(){
  const seen = [...new Set(ROWS.map(d => d.status).filter(Boolean))].sort();
  $('#statusFilter').innerHTML = '<option value="">All statuses</option>' +
    seen.map(s => `<option value="${esc(s)}">${esc(String(s).replace(/_/g,' '))}</option>`).join('');
}

function fail(msg){
  const e = $('#err');
  e.hidden = false;
  e.textContent = msg;
  $('#rows').innerHTML = `<tr><td class="msg" colspan="${COLS.length}">Could not load.</td></tr>`;
}

/* ============ data ============ */
async function init(){
  const { data: loads, error } = await db.from(CFG.table).select('*');
  if(error) return fail('Loading ' + CFG.table + ': ' + error.message);
  if(!loads) return fail('No data returned from ' + CFG.table + '.');

  const margins = {};
  const mv = await db.from(CFG.marginView).select('*');
  if(mv.error){
    console.warn('margin view unavailable:', mv.error.message);
  } else if(mv.data){
    mv.data.forEach(r => {
      const k = firstOf(r, [CFG.marginKey, 'id']);
      if(k != null) margins[k] = r;
    });
  }

  ROWS = loads.map(r => norm(r, margins[r.id]));
  statusOptions();
  render();
}

/* ============ wiring ============ */
$('#q').oninput = e => { view.q = e.target.value; render(); };
$('#statusFilter').onchange = e => { view.status = e.target.value; render(); };
$('#reset').onclick = () => {
  view.tile='total'; view.q=''; view.status='';
  $('#q').value=''; $('#statusFilter').value='';
  render();
};

init();
</script>
</body>
</html>
