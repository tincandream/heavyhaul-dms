<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Setup — Dispatch</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#22221f; --muted:#73726c;
          --line:#e2e0da; --line2:#cfccc4; --accent:#185fa5;
          --danger:#a32d2d; --dangerbg:#fcebeb; --ok:#0f6e56; --okbg:#e4f4ee; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { padding:18px; max-width:900px; margin:0 auto 40px; }

  .tabs { display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
  .tab { padding:7px 14px; border:1px solid var(--line2); background:var(--card);
         border-radius:7px; font-size:13px; cursor:pointer; color:var(--muted);
         margin:0; }
  .tab.on { background:var(--accent); color:#fff; border-color:var(--accent); }

  .panel { display:none; }
  .panel.on { display:block; }

  .card { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:18px; margin-bottom:16px; }
  .card h2 { font-size:14px; font-weight:600; margin:0 0 4px; }
  .card .hint { font-size:12px; color:var(--muted); margin:0 0 14px; }

  .grid { display:grid; gap:12px;
          grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .req label::after { content:' *'; color:var(--danger); }
  input, select, textarea { width:100%; padding:8px 10px;
    border:1px solid var(--line2); border-radius:7px; font-size:14px;
    background:#fff; color:var(--ink); font-family:inherit; }
  textarea { min-height:60px; resize:vertical; }
  .full { grid-column:1/-1; }

  button { padding:9px 18px; border:0; border-radius:7px; background:var(--accent);
           color:#fff; font-size:14px; cursor:pointer; margin-top:14px; }
  button:disabled { opacity:.5; cursor:default; }

  .note { font-size:12px; color:var(--muted); margin-top:10px; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:7px;
         font-size:13px; display:none; }
  .msg.err { display:block; background:var(--dangerbg); color:var(--danger); }
  .msg.ok  { display:block; background:var(--okbg); color:var(--ok); }

  table { width:100%; border-collapse:collapse; margin-top:6px; }
  th { text-align:left; font-size:11.5px; font-weight:500; color:var(--muted);
       padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:9px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  tr:last-child td { border-bottom:0; }
  .empty { color:var(--muted); font-size:13px; padding:10px 0; }
  .warn { background:#fdf3e3; border:1px solid #e8d5ac; color:#8a5a10;
          padding:12px 14px;
