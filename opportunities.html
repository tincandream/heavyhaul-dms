<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opportunities — Dispatch</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#22221f; --muted:#73726c;
          --line:#e2e0da; --line2:#cfccc4; --accent:#185fa5;
          --danger:#a32d2d; --dangerbg:#fcebeb; --warn:#8a5a10; --warnbg:#fdf3e3;
          --ok:#0f6e56; --okbg:#e4f4ee; --accentbg:#e7f0f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { padding:18px; max-width:1400px; margin:0 auto 40px; }

  .tiles { display:grid; gap:10px; margin-bottom:18px;
           grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .tile { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:12px 14px; }
  .tile .n { font-size:22px; font-weight:600; line-height:1.2; }
  .tile .l { font-size:12px; color:var(--muted); margin-top:2px; }
  .tile.alert .n { color:var(--warn); }

  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  select, .search, input, textarea { padding:7px 10px; border:1px solid var(--line2);
    border-radius:7px; font-size:13px; background:var(--card); color:var(--ink);
    font-family:inherit; }
  .search { min-width:190px; }
  .count { font-size:12.5px; color:var(--muted); margin-left:auto; }
  button { font:inherit; cursor:pointer; border-radius:7px; border:1px solid var(--line2);
    background:var(--card); color:var(--ink); padding:7px 13px; font-weight:600; }
  button:hover { background:#faf9f6; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { filter:brightness(1.08); }
  button.danger { border-color:#e2b8b8; color:var(--danger); background:#fff; }

  .wrap { background:var(--card); border:1px solid var(--line);
          border-radius:10px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:1000px; }
  th { text-align:left; font-size:11.5px; font-weight:500; color:var(--muted);
       padding:10px 12px; border-bottom:1px solid var(--line);
       white-space:nowrap; cursor:pointer; user-select:none; }
  th:hover { color:var(--ink); }
  td { padding:11px 12px; border-bottom:1px solid var(--line);
       vertical-align:top; font-size:13px; }
  tr:last-child td { border-bottom:0; }
  tr.row { cursor:pointer; }
  tr.row:hover { background:#faf9f6; }
  .sub2 { font-size:11.5px; color:var(--muted); }
  .lane { font-weight:600; }
  .direct { color:var(--ok); font-size:11px; font-weight:600; }

  .pill { display:inline-block; padding:2px 8px; border-radius:11px;
          font-size:11.5px; white-space:nowrap; }
  .p-new { background:var(--accentbg); color:var(--accent); }
  .p-rev { background:var(--warnbg); color:var(--warn); }
  .p-quo { background:var(--warnbg); color:var(--warn); }
  .p-neg { background:var(--warnbg); color:var(--warn); }
  .p-book { background:var(--okbg); color:var(--ok); }
  .p-lost { background:#f0efeb; color:var(--muted); border:1px solid var(--line); }
  .flag { background:var(--warnbg); color:var(--warn); }
  .flagr { background:var(--dangerbg); color:var(--danger); }
  .msg { padding:26px; text-align:center; color:var(--muted); font-size:13px; }
  .msg.bad { color:var(--danger); }

  dialog { border:none; border-radius:12px; padding:0; width:min(680px,94vw);
    box-shadow:0 12px 40px rgba(10,14,25,.28); color:var(--ink); }
  dialog::backdrop { background:rgba(12,16,26,.45); }
  .dh { padding:14px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  .db { padding:16px; max-height:66vh; overflow:auto; }
  .df { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px;
        align-items:center; background:#fbfaf7; }
  .fg { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .fld { display:flex; flex-direction:column; gap:4px; }
  .fld.full { grid-column:1/-1; }
  .fld label { font-size:12px; font-weight:600; color:var(--muted); }
  .fld input, .fld select, .fld textarea { width:100%; }
  .checks { display:flex; gap:16px; flex-wrap:wrap; padding-top:4px; }
  .checks label { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
  .checks input { width:auto; }
  .spacer { flex:1; }
  .err { color:var(--danger); font-size:12px; font-weight:600; }
  .fs { border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:12px; }
  .fs legend { font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); font-weight:700; padding:0 6px; }

  .facility-head {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    grid-column:1/-1;
    margin-top:2px;
  }
  .facility-head strong {
    font-size:12px;
    font-weight:600;
    color:var(--ink);
  }
  .facility-toggle {
    border:0;
    background:transparent;
    color:var(--accent);
    padding:2px 0;
    font-size:12px;
    font-weight:500;
  }
  .facility-toggle:hover {
    background:transparent;
    text-decoration:underline;
  }
  .facility-details {
    display:none;
    grid-column:1/-1;
    padding-top:2px;
  }
  .facility-details.open { display:block; }
  .facility-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    padding:10px 0 2px;
    border-top:1px solid var(--line);
  }

</style>
</head>
<body>

<header></header>

<main>
  <div class="tiles" id="tiles"></div>

  <div class="bar">
    <button class="primary" id="addBtn">+ Add opportunity</button>
    <input class="search" id="q" placeholder="Search broker, lane, commodity…">
    <select id="fstatus"><option value="">All statuses</option></select>
    <select id="fsource"><option value="">All sources</option></select>
    <label style="font-size:13px;display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="fover"> Oversize only</label>
    <span class="count" id="count"></span>
  </div>

  <div class="wrap">
    <table>
      <thead><tr>
        <th data-k="broker_name">Broker</th>
        <th data-k="origin_state">Lane</th>
        <th data-k="pickup_date">Pickup</th>
        <th data-k="equipment_needed">Equipment</th>
        <th data-k="weight_lbs">Dims / Weight</th>
        <th data-k="status">Status</th>
        <th data-k="quoted_rate">Rate</th>
        <th data-k="source_type">Source</th>
      </tr></thead>
      <tbody id="body"><tr><td colspan="8" class="msg">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<!-- ADD / EDIT DIALOG -->
<dialog id="dlg">
  <div class="dh" id="dlgTitle">Add Opportunity</div>
  <div class="db">
    <input type="hidden" id="o_id">
    <div class="fg">
      <div class="fld full"><label for="o_broker">Broker</label>
        <input id="o_broker" placeholder="ABC Logistics"></div>
      <div class="fld"><label for="o_source">Source</label>
        <select id="o_source">
          <option value="phone">Phone</option>
          <option value="email">Email</option>
          <option value="portal">Portal</option>
          <option value="text">Text</option>
          <option value="referral">Referral</option>
          <option value="repeat_lane">Repeat lane</option>
          <option value="walk_in">Walk-in</option>
          <option value="other">Other</option>
        </select></div>
      <div class="fld"><label for="o_status">Status</label>
        <select id="o_status">
  <option value="new">New</option>
  <option value="reviewing">Reviewing</option>
  <option value="contacted">Contacted</option>
  <option value="quoted">Quoted</option>
  <option value="negotiating">Negotiating</option>
  <option value="booked">Booked</option>
  <option value="passed">Passed</option>
  <option value="rejected">Rejected</option>
  <option value="expired">Expired</option>
</select></div>
      <div class="fld"><label for="o_ref">Broker load #</label>
        <input id="o_ref" placeholder="optional"></div>
    </div>

    <fieldset class="fs"><legend>Lane</legend>
      <div class="fg">

        <div class="facility-head">
          <strong>Pickup</strong>
          <button type="button" class="facility-toggle" id="pickupDetailsBtn">+ Facility details</button>
        </div>

        <div class="fld full">
          <label for="o_pickup_facility">Pickup facility</label>
          <input id="o_pickup_facility" placeholder="Facility / shipper name">
        </div>

        <div class="fld"><label for="o_ocity">Origin city</label><input id="o_ocity"></div>
        <div class="fld"><label for="o_ostate">Origin state</label><input id="o_ostate" maxlength="2" style="text-transform:uppercase"></div>
        <div class="fld"><label for="o_pickup">Pickup date</label><input type="date" id="o_pickup"></div>

        <div class="facility-details" id="pickupDetails">
          <div class="facility-grid">
            <div class="fld full"><label for="o_pickup_address">Street address</label><input id="o_pickup_address"></div>
            <div class="fld"><label for="o_pickup_zip">ZIP</label><input id="o_pickup_zip"></div>
            <div class="fld"><label for="o_pickup_contact">Contact</label><input id="o_pickup_contact"></div>
            <div class="fld"><label for="o_pickup_phone">Phone</label><input id="o_pickup_phone"></div>
            <div class="fld"><label for="o_pickup_hours">Hours / appointment</label><input id="o_pickup_hours"></div>
            <div class="fld full"><label for="o_pickup_instructions">Instructions / notes</label><textarea id="o_pickup_instructions"></textarea></div>
          </div>
        </div>

        <div class="facility-head" style="margin-top:10px">
          <strong>Delivery</strong>
          <button type="button" class="facility-toggle" id="deliveryDetailsBtn">+ Facility details</button>
        </div>

        <div class="fld full">
          <label for="o_delivery_facility">Delivery facility</label>
          <input id="o_delivery_facility" placeholder="Facility / receiver name">
        </div>

        <div class="fld"><label for="o_dcity">Dest city</label><input id="o_dcity"></div>
        <div class="fld"><label for="o_dstate">Dest state</label><input id="o_dstate" maxlength="2" style="text-transform:uppercase"></div>
        <div class="fld"><label for="o_delivery">Delivery date</label><input type="date" id="o_delivery"></div>

        <div class="facility-details" id="deliveryDetails">
          <div class="facility-grid">
            <div class="fld full"><label for="o_delivery_address">Street address</label><input id="o_delivery_address"></div>
            <div class="fld"><label for="o_delivery_zip">ZIP</label><input id="o_delivery_zip"></div>
            <div class="fld"><label for="o_delivery_contact">Contact</label><input id="o_delivery_contact"></div>
            <div class="fld"><label for="o_delivery_phone">Phone</label><input id="o_delivery_phone"></div>
            <div class="fld"><label for="o_delivery_hours">Hours / appointment</label><input id="o_delivery_hours"></div>
            <div class="fld full"><label for="o_delivery_instructions">Instructions / notes</label><textarea id="o_delivery_instructions"></textarea></div>
          </div>
        </div>

        <div class="fld"><label for="o_miles">Miles</label><input type="number" id="o_miles"></div>

      </div>
    </fieldset>

    <fieldset class="fs"><legend>Freight</legend>
      <div class="fg">
        <div class="fld full"><label for="o_commodity">Commodity</label>
          <input id="o_commodity" placeholder="Excavator"></div>
        <div class="fld"><label for="o_equip">Equipment</label>
          <input id="o_equip" placeholder="RGN / Step deck"></div>
        <div class="fld"><label for="o_len">Length (ft)</label><input type="number" step="0.1" id="o_len"></div>
        <div class="fld"><label for="o_wid">Width (ft)</label><input type="number" step="0.1" id="o_wid"></div>
        <div class="fld"><label for="o_hgt">Height (ft)</label><input type="number" step="0.1" id="o_hgt"></div>
        <div class="fld"><label for="o_wt">Weight (lbs)</label><input type="number" id="o_wt"></div>
      </div>
      <div class="checks" style="margin-top:10px">
        <label><input type="checkbox" id="o_super"> Superload</label>
        <span class="sub2">Oversize / overweight are flagged automatically from dimensions.</span>
      </div>
    </fieldset>

    <fieldset class="fs"><legend>Rate</legend>
      <div class="fg">
        <div class="fld"><label for="o_posted">Posted rate ($)</label><input type="number" step="0.01" id="o_posted"></div>
        <div class="fld"><label for="o_quoted">Quoted rate ($)</label><input type="number" step="0.01" id="o_quoted"></div>
        <div class="fld"><label for="o_booked">Booked rate ($)</label><input type="number" step="0.01" id="o_booked"></div>
      </div>
    </fieldset>

    <div class="fld full" style="margin-top:12px"><label for="o_notes">Notes</label>
      <textarea id="o_notes" style="min-height:64px"></textarea></div>
    <div id="o_err" class="err"></div>
  </div>
  <div class="df">
    <button class="primary" id="saveBtn">Save</button>
    <button id="cancelBtn">Cancel</button>
    <span class="spacer"></span>
    <button class="danger" id="delBtn" style="display:none">Delete</button>
  </div>
</dialog>

<div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);
  background:#22221f;color:#fff;padding:11px 18px;border-radius:9px;font-weight:600;font-size:13px;
  opacity:0;transition:.22s;z-index:9999;pointer-events:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nav.js"></script>
<script>
const SUPABASE_URL = 'https://zyhdatteglxozsgnjhrm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5aGRhdHRlZ2x4b3pzZ25qaHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODEzMTAsImV4cCI6MjEwMDg1NzMxMH0.I4SlAWiqKk0oPv-0WRgVy_AAGnQ0NoT8-T8z62jIj7Y';

const $ = id => document.getElementById(id);
let db = null, TENANT_ID = null, rows = [], sortKey = null, sortDir = 1;

function fail(text){ $('body').innerHTML = '<tr><td colspan="8" class="msg bad">'+text+'</td></tr>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function txt(v){ const s=(v==null?'':String(v)).trim(); return s===''?null:s; }
function num(v){ if(v==null||v==='')return null; const n=Number(v); return isNaN(n)?null:n; }
function upper(v){ const s=txt(v); return s?s.toUpperCase():null; }
function money(n){ if(n==null||n==='')return '—'; const v=Number(n); if(isNaN(v))return '—';
  return v.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}); }
function fmtDate(v){ if(!v)return '—'; const d=new Date(v); if(isNaN(d))return String(v);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function pretty(s){ return s?String(s).replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()):''; }

let toastTimer=null;
function toast(m){ const t=$('toast'); t.textContent=m;
  t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.style.opacity='0';
    t.style.transform='translateX(-50%) translateY(80px)'; },2600); }

window.onerror = m => fail('JS error: ' + m);

if (typeof window.supabase === 'undefined') {
  fail('Supabase library did not load. Check your connection and reload.');
} else {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  start();
}

async function start(){
  const s = await db.auth.getSession();
  if (!s.data.session) { location.href = 'index.html'; return; }
  TENANT_ID = await buildNav(db, 'Opportunities');
  if (!TENANT_ID) { fail('No app_users row linked to this login.'); return; }
  wire();
  load();
}

const STATUS_PILL = { new:'p-new', reviewing:'p-rev', quoted:'p-quo',
  negotiating:'p-neg', booked:'p-book', lost:'p-lost', expired:'p-lost', declined:'p-lost' };

async function load(){
  const r = await db.from('load_opportunities').select('*')
    .is('closed_at', null)
    .order('first_seen_at', { ascending:false });

  if (r.error){ fail('Query failed: ' + r.error.message); return; }
  rows = r.data || [];
  fillFilters(); tiles(); render();
}

function tiles(){
  const open = rows.filter(r=>['new','reviewing','quoted','negotiating'].includes(r.status));
  const t = [
    ['Open', open.length, false],
    ['New', rows.filter(r=>r.status==='new').length, false],
    ['Quoting', rows.filter(r=>['quoted','negotiating'].includes(r.status)).length, false],
    ['Booked', rows.filter(r=>r.status==='booked').length, false],
    ['Oversize open', open.filter(r=>r.is_oversize||r.is_superload).length, true]
  ];
  $('tiles').innerHTML = t.map(([l,n,a])=>'<div class="tile'+(a&&n>0?' alert':'')+'">'+
    '<div class="n">'+n+'</div><div class="l">'+l+'</div></div>').join('');
}

function dims(r){
  const p=[];
  if(r.length_ft) p.push(r.length_ft+"'L");
  if(r.width_ft)  p.push(r.width_ft+"'W");
  if(r.height_ft) p.push(r.height_ft+"'H");
  let s = p.join(' · ');
  if(r.weight_lbs) s += (s?' · ':'')+Number(r.weight_lbs).toLocaleString()+' lb';
  return s || '—';
}

function render(){
  const q = $('q').value.toLowerCase().trim();
  let list = rows.filter(r=>{
    if ($('fstatus').value && r.status !== $('fstatus').value) return false;
    if ($('fsource').value && r.source_type !== $('fsource').value) return false;
    if ($('fover').checked && !(r.is_oversize || r.is_superload)) return false;
    if (q){
      const hay=[r.broker_name,r.pickup_facility_name,r.delivery_facility_name,
        r.origin_city,r.origin_state,r.dest_city,r.dest_state,
        r.commodity,r.equipment_needed].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if (sortKey) list.sort((a,b)=>{ const x=a[sortKey],y=b[sortKey];
    if(x==null)return 1; if(y==null)return -1; return (x>y?1:x<y?-1:0)*sortDir; });

  $('count').textContent = list.length + ' of ' + rows.length;
  if (!list.length){ $('body').innerHTML='<tr><td colspan="8" class="msg">No opportunities. Click “+ Add opportunity”.</td></tr>'; return; }

  $('body').innerHTML = list.map(r=>{
    const lane = (r.origin_city||r.origin_state||r.dest_city||r.dest_state)
      ? esc((r.origin_city||'?')+(r.origin_state?', '+r.origin_state:'')) + ' → ' +
        esc((r.dest_city||'?')+(r.dest_state?', '+r.dest_state:''))
      : '<span class="sub2">—</span>';
    const rate = r.booked_rate!=null?r.booked_rate:(r.quoted_rate!=null?r.quoted_rate:r.posted_rate);
    const rateLbl = r.booked_rate!=null?'booked':(r.quoted_rate!=null?'quoted':(r.posted_rate!=null?'posted':''));
    let flags='';
    if(r.is_superload) flags='<span class="pill flagr">Superload</span>';
    else if(r.is_oversize) flags='<span class="pill flag">OS</span>';
    if(r.is_overweight) flags+=' <span class="pill flag">OW</span>';
    return '<tr class="row" data-id="'+esc(r.id)+'">'+
      '<td><span class="lane">'+esc(r.broker_name||'—')+'</span>'+
        (r.external_ref?'<div class="sub2">#'+esc(r.external_ref)+'</div>':'')+'</td>'+
      '<td>'+lane+(r.miles?'<div class="sub2">'+Number(r.miles).toLocaleString()+' mi</div>':'')+'</td>'+
      '<td>'+esc(fmtDate(r.pickup_date))+'</td>'+
      '<td>'+esc(r.equipment_needed||'—')+(r.commodity?'<div class="sub2">'+esc(r.commodity)+'</div>':'')+'</td>'+
      '<td>'+dims(r)+(flags?'<div style="margin-top:3px">'+flags+'</div>':'')+'</td>'+
      '<td><span class="pill '+(STATUS_PILL[r.status]||'p-lost')+'">'+esc(pretty(r.status))+'</span></td>'+
      '<td>'+(rate!=null?money(rate):'—')+(rateLbl?'<div class="sub2">'+rateLbl+'</div>':'')+'</td>'+
      '<td>'+esc(pretty(r.source_type))+'</td>'+
      '</tr>';
  }).join('');

  document.querySelectorAll('tr[data-id]').forEach(tr=>
    tr.addEventListener('click',()=>openDlg(tr.dataset.id)));
}


// ===== sourcing timeline =====
function opportunityLane(row){
  const origin=[row.origin_city,row.origin_state].filter(Boolean).join(', ');
  const destination=[row.dest_city,row.dest_state].filter(Boolean).join(', ');
  return {origin,destination,text:origin&&destination?origin+' → '+destination:(origin||destination||'')};
}

async function logSourcingEvent(eventType,title,detail,opportunity,rateAmount){
  if(!TENANT_ID)return;
  const lane=opportunityLane(opportunity||{});
  const r=await db.from('sourcing_events').insert({
    tenant_id:TENANT_ID,
    opportunity_id:opportunity&&opportunity.id?opportunity.id:null,
    event_type:eventType,
    title:title,
    detail:detail||null,
    broker_name:opportunity?opportunity.broker_name||null:null,
    lane_origin:lane.origin||null,
    lane_destination:lane.destination||null,
    rate_amount:rateAmount==null?null:Number(rateAmount)
  });
  if(r.error)console.warn('Sourcing timeline event was not recorded:',r.error.message);
}

function sourcingEventForChange(previous,current,isNew){
  const lane=opportunityLane(current);
  const broker=current.broker_name||'Opportunity';
  const detail=broker+(lane.text?' · '+lane.text:'');
  if(isNew)return {type:'opportunity_added',title:'Opportunity added',detail,rate:current.posted_rate};
  if(previous&&previous.status!==current.status){
const map = {
  reviewing:
    ['opportunity_reviewed', 'Opportunity moved to reviewing'],

  contacted:
    ['broker_contacted', 'Broker contacted'],

  quoted:
    ['quote_sent', 'Opportunity quoted'],

  negotiating:
    ['rate_negotiated', 'Rate negotiation started'],

  booked:
    ['load_booked', 'Load booked'],

  passed:
    ['load_passed', 'Opportunity passed'],

  rejected:
    ['load_rejected', 'Opportunity rejected'],

  expired:
    ['load_passed', 'Opportunity expired']
};
    if(map[current.status])return {
      type:map[current.status][0],title:map[current.status][1],detail,
      rate:current.status==='booked'?current.booked_rate:current.quoted_rate
    };
  }
  if(previous&&previous.quoted_rate!==current.quoted_rate&&current.quoted_rate!=null)
    return {type:'quote_prepared',title:'Quote updated',detail,rate:current.quoted_rate};
  if(previous&&previous.booked_rate!==current.booked_rate&&current.booked_rate!=null)
    return {type:'rate_negotiated',title:'Booked rate updated',detail,rate:current.booked_rate};
  return {type:'opportunity_reviewed',title:'Opportunity updated',detail,rate:current.quoted_rate||current.posted_rate};
}

async function save(){
  $('o_err').textContent='';
  const btn=$('saveBtn'); btn.disabled=true;
  const id=txt($('o_id').value);
  const previous=id?(rows.find(x=>x.id===id)||null):null;
  const w=num($('o_wid').value),h=num($('o_hgt').value),l=num($('o_len').value),wt=num($('o_wt').value);
  const row={
    broker_name:txt($('o_broker').value),source_type:$('o_source').value,status:$('o_status').value,
    external_ref:txt($('o_ref').value),

    pickup_facility_name:txt($('o_pickup_facility').value),
    origin_city:txt($('o_ocity').value),
    origin_state:upper($('o_ostate').value),
    pickup_date:txt($('o_pickup').value),
    pickup_address:txt($('o_pickup_address').value),
    pickup_zip:txt($('o_pickup_zip').value),
    pickup_contact_name:txt($('o_pickup_contact').value),
    pickup_phone:txt($('o_pickup_phone').value),
    pickup_hours:txt($('o_pickup_hours').value),
    pickup_instructions:txt($('o_pickup_instructions').value),

    delivery_facility_name:txt($('o_delivery_facility').value),
    dest_city:txt($('o_dcity').value),
    dest_state:upper($('o_dstate').value),
    delivery_date:txt($('o_delivery').value),
    delivery_address:txt($('o_delivery_address').value),
    delivery_zip:txt($('o_delivery_zip').value),
    delivery_contact_name:txt($('o_delivery_contact').value),
    delivery_phone:txt($('o_delivery_phone').value),
    delivery_hours:txt($('o_delivery_hours').value),
    delivery_instructions:txt($('o_delivery_instructions').value),

    miles:num($('o_miles').value),commodity:txt($('o_commodity').value),equipment_needed:txt($('o_equip').value),
    length_ft:l,width_ft:w,height_ft:h,weight_lbs:wt,is_superload:$('o_super').checked,
    is_oversize:(w!=null&&w>8.5)||(h!=null&&h>13.5)||(l!=null&&l>53),is_overweight:(wt!=null&&wt>80000),
    posted_rate:num($('o_posted').value),quoted_rate:num($('o_quoted').value),
    booked_rate:num($('o_booked').value),notes:txt($('o_notes').value)
  };
  let result;
  if(id){
    result=await db.from('load_opportunities').update(row).eq('id',id).select('*').single();
  }else{
    row.tenant_id=TENANT_ID;
    result=await db.from('load_opportunities').insert(row).select('*').single();
  }
  btn.disabled=false;
  if(result.error){$('o_err').textContent=result.error.message||'Save failed';return;}
 const saved=result.data||row;

const event=
  sourcingEventForChange(
    previous,
    saved,
    !id
  );

await logSourcingEvent(
  event.type,
  event.title,
  event.detail,
  saved,
  event.rate
);

$('dlg').close();

/*
 * BOOKED OPPORTUNITY → NEW LOAD
 *
 * A booked broker load now moves into the
 * Dispatch assembly stage.
 *
 * It is NOT sent to Fleet Board yet.
 */
/*
 * Any opportunity saved with status BOOKED opens New Load.
 *
 * This intentionally includes a load that was already booked.
 * Re-saving Booked therefore gives the dispatcher a reliable way
 * to get back to Load Assembly if the load is no longer visible
 * in the New Load queue.
 */
if (saved.status === 'booked') {

  toast(
    previous && previous.status === 'booked'
      ? 'Booked load — reopening New Load…'
      : 'Load booked — opening New Load…'
  );

  setTimeout(
    () => {

      location.href =
        'newload.html?opportunity=' +
        encodeURIComponent(saved.id);

    },
    700
  );

  return;
}

toast(
  id
    ? 'Updated'
    : 'Added'
);

load();
}

async function del(){
  const id=txt($('o_id').value);
  if(!id)return;
  if(!confirm('Delete this opportunity?'))return;
  const previous=rows.find(x=>x.id===id)||null;
  const r=await db.from('load_opportunities').delete().eq('id',id);
  if(r.error){$('o_err').textContent=r.error.message;return;}
  if(previous){
    const lane=opportunityLane(previous);
    await logSourcingEvent(
      'load_passed','Opportunity removed',
      (previous.broker_name||'Opportunity')+(lane.text?' · '+lane.text:''),
      previous,previous.quoted_rate||previous.posted_rate
    );
  }
  $('dlg').close();toast('Deleted');load();
}

    $('deliveryDetailsBtn').textContent=open?'− Hide details':'+ Facility details';
  });

  ['q','fstatus','fsource','fover'].forEach(id=>{
    $(id).addEventListener('input', render);
    $(id).addEventListener('change', render);
  });
  document.querySelectorAll('th[data-k]').forEach(th=>

      const k=th.dataset.k;
      if(sortKey===k) sortDir=-sortDir; else{ sortKey=k; sortDir=1; }
      render();
    }));
}

function ttDateOffset(days){
  const d = new Date();
  d.setDate(d.getDate() + days);
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

function ttFillOpportunity(){

  const data = Object.assign({}, TT_BROKER_LOAD, {
    o_pickup:   ttDateOffset(1),
    o_delivery: ttDateOffset(2)
  });

  Object.keys(data).forEach(function(id){

    const el = document.getElementById(id);
    if (!el) return;

    if (el.type === 'checkbox'){
      el.checked = !!data[id];
    } else if (el.tagName === 'SELECT'){
      const wanted = String(data[id]).toLowerCase();
      const match = Array.from(el.options).find(function(o){
        return o.value.toLowerCase() === wanted ||
               o.textContent.trim().toLowerCase() === wanted;
      });
      if (match) el.value = match.value;
    } else {
      el.value = data[id];
    }

    el.dispatchEvent(new Event('input',  { bubbles:true }));
    el.dispatchEvent(new Event('change', { bubbles:true }));

  });

  const sup = document.getElementById('o_super');
  if (sup) sup.checked = false;

  ['pickupDetails','deliveryDetails'].forEach(function(boxId){
    const box = document.getElementById(boxId);
    if (box) box.classList.add('open');
  });
  const pb = document.getElementById('pickupDetailsBtn');
  if (pb) pb.textContent = '\u2212 Hide details';
  const db2 = document.getElementById('deliveryDetailsBtn');
  if (db2) db2.textContent = '\u2212 Hide details';

  toast('Test data filled - review and Save');
}

async function ttInitOpportunity(){

  let active = false;

  try {
    const r = await db.rpc('get_training_mode_status');
    if (!r.error && r.data) active = r.data.active === true;
  } catch (e){
    return;
  }

  if (!active) return;

  const saveBtn = document.getElementById('saveBtn');
  if (!saveBtn) return;
  if (document.getElementById('ttFillBtn')) return;

  const b = document.createElement('button');
  b.id = 'ttFillBtn';
  b.type = 'button';
  b.textContent = 'Fill test data';
  b.style.cssText =
    'background:#B8B05D;border:1px solid #B8B05D;' +
    'color:#3C3A4B;font-weight:600;cursor:pointer;';

  b.addEventListener('click', ttFillOpportunity);

  saveBtn.parentNode.insertBefore(b, saveBtn);
}

/* start once the Supabase client exists */
(function ttBoot(){
  if (typeof db === 'undefined' || !db){
    setTimeout(ttBoot, 300);
    return;
  }
  ttInitOpportunity();
})();
