<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portals — Dispatch</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#22221f; --muted:#73726c;
          --line:#e2e0da; --line2:#cfccc4; --accent:#185fa5;
          --danger:#a32d2d; --dangerbg:#fcebeb; --warn:#8a5a10; --warnbg:#fdf3e3;
          --ok:#0f6e56; --okbg:#e4f4ee; --accentbg:#e7f0f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { padding:18px; max-width:1200px; margin:0 auto 40px; }

  .tiles { display:grid; gap:10px; margin-bottom:18px;
           grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .tile { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:12px 14px; }
  .tile .n { font-size:22px; font-weight:600; }
  .tile .l { font-size:12px; color:var(--muted); margin-top:2px; }
  .tile.alert .n { color:var(--warn); }

  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  select, .search, input, textarea { padding:7px 10px; border:1px solid var(--line2);
    border-radius:7px; font-size:13px; background:var(--card); color:var(--ink); font-family:inherit; }
  .search { min-width:190px; }
  .count { font-size:12.5px; color:var(--muted); margin-left:auto; }
  button { font:inherit; cursor:pointer; border-radius:7px; border:1px solid var(--line2);
    background:var(--card); color:var(--ink); padding:7px 13px; font-weight:600; }
  button:hover { background:#faf9f6; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { filter:brightness(1.08); }
  button.sm { padding:5px 10px; font-size:12px; }
  button.danger { border-color:#e2b8b8; color:var(--danger); background:#fff; }

  .wrap { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:900px; }
  th { text-align:left; font-size:11.5px; font-weight:500; color:var(--muted);
       padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
  tr:last-child td { border-bottom:0; }
  .sub2 { font-size:11.5px; color:var(--muted); }
  .name { font-weight:600; }
  .stars { color:var(--warn); letter-spacing:1px; }
  a.plink { color:var(--accent); text-decoration:none; }
  a.plink:hover { text-decoration:underline; }

  .pill { display:inline-block; padding:2px 8px; border-radius:11px; font-size:11.5px; white-space:nowrap; }
  .p-active { background:var(--okbg); color:var(--ok); }
  .p-pending { background:var(--warnbg); color:var(--warn); }
  .p-locked { background:var(--dangerbg); color:var(--danger); }
  .p-expired { background:var(--dangerbg); color:var(--danger); }
  .p-revoked { background:#f0efeb; color:var(--muted); }
  .due { color:var(--danger); font-weight:600; }
  .msg { padding:26px; text-align:center; color:var(--muted); font-size:13px; }
  .msg.bad { color:var(--danger); }

  dialog { border:none; border-radius:12px; padding:0; width:min(620px,94vw);
    box-shadow:0 12px 40px rgba(10,14,25,.28); color:var(--ink); }
  dialog::backdrop { background:rgba(12,16,26,.45); }
  .dh { padding:14px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  .db { padding:16px; max-height:66vh; overflow:auto; }
  .df { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px;
        align-items:center; background:#fbfaf7; }
  .fg { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .fld { display:flex; flex-direction:column; gap:4px; }
  .fld.full { grid-column:1/-1; }
  .fld label { font-size:12px; font-weight:600; color:var(--muted); }
  .fld input, .fld select, .fld textarea { width:100%; }
  .checks { display:flex; gap:16px; flex-wrap:wrap; padding-top:4px; }
  .checks label { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
  .checks input { width:auto; }
  .spacer { flex:1; }
  .err { color:var(--danger); font-size:12px; font-weight:600; }
  .hint { font-size:11.5px; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>

<header></header>

<main>
  <div class="tiles" id="tiles"></div>

  <div class="bar">
    <button class="primary" id="addBtn">+ Add portal</button>
    <input class="search" id="q" placeholder="Search portal, broker…">
    <select id="fstatus"><option value="">All access</option></select>
    <label style="font-size:13px;display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="fdue"> Due to check</label>
    <span class="count" id="count"></span>
  </div>

  <div class="wrap">
    <table>
      <thead><tr>
        <th>Portal</th><th>Broker</th><th>Access</th>
        <th>Last checked</th><th>Next check</th><th>Useful</th><th></th>
      </tr></thead>
      <tbody id="body"><tr><td colspan="7" class="msg">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<!-- ADD / EDIT PORTAL DIALOG -->
<dialog id="dlg">
  <div class="dh" id="dlgTitle">Add Portal</div>
  <div class="db">
    <input type="hidden" id="p_id">
    <div class="fg">
      <div class="fld"><label for="p_name">Portal name *</label>
        <input id="p_name" placeholder="TMC Carrier Portal"></div>
      <div class="fld"><label for="p_broker">Broker</label>
        <input id="p_broker" placeholder="TMC Transportation"></div>
      <div class="fld full"><label for="p_url">Portal URL *</label>
        <input id="p_url" placeholder="https://carrier.example.com"></div>
      <div class="fld"><label for="p_platform">Platform</label>
        <input id="p_platform" placeholder="RMIS / Truckstop / proprietary"></div>
      <div class="fld"><label for="p_user">Username</label><input id="p_user"></div>
      <div class="fld full"><label for="p_cred">Password reference</label>
        <input id="p_cred" placeholder="1Password > Brokers > TMC">
        <div class="hint">A pointer to where the password lives — never the password itself.</div></div>
      <div class="fld"><label for="p_status">Access status</label>
        <select id="p_status">
          <option value="pending">Pending</option>
          <option value="active">Active</option>
          <option value="locked">Locked</option>
          <option value="expired">Expired</option>
          <option value="revoked">Revoked</option>
        </select></div>
      <div class="fld"><label for="p_freq">Check frequency</label>
        <select id="p_freq">
          <option value="hourly">Hourly</option>
          <option value="twice_daily">Twice daily</option>
          <option value="daily" selected>Daily</option>
          <option value="weekly">Weekly</option>
          <option value="as_needed">As needed</option>
        </select></div>
      <div class="fld"><label for="p_besttime">Best check time</label>
        <input id="p_besttime" placeholder="Early AM"></div>
      <div class="fld"><label for="p_score">Usefulness (1–5)</label>
        <input type="number" id="p_score" min="1" max="5"></div>
    </div>
    <div class="checks" style="margin-top:10px">
      <label><input type="checkbox" id="p_oversize"> Posts oversize</label>
    </div>
    <div class="fld full" style="margin-top:12px"><label for="p_notes">Notes</label>
      <textarea id="p_notes" style="min-height:56px"></textarea></div>
    <div id="p_err" class="err"></div>
  </div>
  <div class="df">
    <button class="primary" id="saveBtn">Save</button>
    <button id="cancelBtn">Cancel</button>
    <span class="spacer"></span>
    <button class="danger" id="delBtn" style="display:none">Delete</button>
  </div>
</dialog>

<div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);
  background:#22221f;color:#fff;padding:11px 18px;border-radius:9px;font-weight:600;font-size:13px;
  opacity:0;transition:.22s;z-index:9999;pointer-events:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nav.js"></script>
<script>
const SUPABASE_URL = 'https://zyhdatteglxozsgnjhrm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5aGRhdHRlZ2x4b3pzZ25qaHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODEzMTAsImV4cCI6MjEwMDg1NzMxMH0.I4SlAWiqKk0oPv-0WRgVy_AAGnQ0NoT8-T8z62jIj7Y';

const $ = id => document.getElementById(id);
let db = null, TENANT_ID = null, rows = [];

function fail(t){ $('body').innerHTML='<tr><td colspan="7" class="msg bad">'+t+'</td></tr>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function txt(v){ const s=(v==null?'':String(v)).trim(); return s===''?null:s; }
function num(v){ if(v==null||v==='')return null; const n=Number(v); return isNaN(n)?null:n; }
function pretty(s){ return s?String(s).replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()):''; }
function fmtDT(v){ if(!v)return '—'; const d=new Date(v); if(isNaN(d))return String(v);
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }

let toastTimer=null;
function toast(m){ const t=$('toast'); t.textContent=m; t.style.opacity='1';
  t.style.transform='translateX(-50%) translateY(0)'; clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(80px)'; },2600); }

window.onerror = m => fail('JS error: ' + m);

if (typeof window.supabase === 'undefined') {
  fail('Supabase library did not load. Reload the page.');
} else {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  start();
}

async function start(){
  const s = await db.auth.getSession();
  if (!s.data.session) { location.href = 'index.html'; return; }
  TENANT_ID = await buildNav(db, 'Portals');
  if (!TENANT_ID) { fail('No app_users row linked to this login.'); return; }
  wire();
  load();
}

const STATUS_PILL = { pending:'p-pending', active:'p-active', locked:'p-locked',
  expired:'p-expired', revoked:'p-revoked' };
const FREQ_MS = { hourly:3600e3, twice_daily:6*3600e3, daily:24*3600e3,
  weekly:7*24*3600e3, as_needed:24*3600e3 };

async function load(){
  const r = await db.from('broker_portals').select('*')
    .order('usefulness_score', { ascending:false, nullsFirst:false });
  if (r.error){ fail('Query failed: ' + r.error.message); return; }
  rows = r.data || [];
  fillFilters(); tiles(); render();
}

function fillFilters(){
  const sel=$('fstatus'), keep=sel.value;
  const vals=[...new Set(rows.map(r=>r.access_status).filter(Boolean))].sort();
  sel.innerHTML='<option value="">All access</option>'+
    vals.map(v=>'<option value="'+esc(v)+'">'+esc(pretty(v))+'</option>').join('');
  sel.value=keep;
}

function isDue(r){
  if (!r.next_check_at) return true; // never checked = due
  return new Date(r.next_check_at) <= new Date();
}

function tiles(){
  const active = rows.filter(r=>r.access_status==='active');
  const due = active.filter(isDue).length;
  const os  = rows.filter(r=>r.posts_oversize).length;
  const t = [
    ['Portals', rows.length, false],
    ['Due to check', due, true],
    ['Posts oversize', os, false]
  ];
  $('tiles').innerHTML = t.map(([l,n,a])=>'<div class="tile'+(a&&n>0?' alert':'')+'">'+
    '<div class="n">'+n+'</div><div class="l">'+l+'</div></div>').join('');
}

function stars(n){ if(!n)return '<span class="sub2">—</span>';
  return '<span class="stars">'+'★'.repeat(n)+'</span>'; }

function render(){
  const q=$('q').value.toLowerCase().trim();
  let list=rows.filter(r=>{
    if ($('fstatus').value && r.access_status!==$('fstatus').value) return false;
    if ($('fdue').checked && !isDue(r)) return false;
    if (q){ const hay=[r.portal_name,r.broker_name,r.platform].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false; }
    return true;
  });
  $('count').textContent = list.length+' of '+rows.length;

  if (!list.length){ $('body').innerHTML='<tr><td colspan="7" class="msg">No portals. Click “+ Add portal”.</td></tr>'; return; }

  $('body').innerHTML = list.map(r=>{
    const due = isDue(r) && r.access_status==='active';
    return '<tr>'+
      '<td><span class="name">'+esc(r.portal_name)+'</span>'+
        (r.portal_url?'<div><a class="plink" href="'+esc(r.portal_url)+'" target="_blank" rel="noopener">open ↗</a></div>':'')+
        (r.platform?'<div class="sub2">'+esc(r.platform)+'</div>':'')+'</td>'+
      '<td>'+esc(r.broker_name||'—')+
        (r.posts_oversize?'<div class="sub2" style="color:var(--warn)">oversize</div>':'')+'</td>'+
      '<td><span class="pill '+(STATUS_PILL[r.access_status]||'p-pending')+'">'+esc(pretty(r.access_status))+'</span></td>'+
      '<td>'+esc(fmtDT(r.last_checked_at))+'</td>'+
      '<td>'+(due?'<span class="due">now</span>':esc(fmtDT(r.next_check_at)))+
        '<div class="sub2">'+esc(pretty(r.check_frequency))+'</div></td>'+
      '<td>'+stars(r.usefulness_score)+'</td>'+
      '<td style="white-space:nowrap">'+
        '<button class="primary sm" data-check="'+esc(r.id)+'">Checked</button> '+
        '<button class="sm" data-edit="'+esc(r.id)+'">Edit</button></td>'+
      '</tr>';
  }).join('');

  document.querySelectorAll('button[data-check]').forEach(b=>
    b.addEventListener('click', ()=>markChecked(b.dataset.check)));
  document.querySelectorAll('button[data-edit]').forEach(b=>
    b.addEventListener('click', ()=>openDlg(b.dataset.edit)));
}

async function markChecked(id){
  const r = rows.find(x=>x.id===id);
  const ms = FREQ_MS[r.check_frequency] || FREQ_MS.daily;
  const next = new Date(Date.now()+ms).toISOString();
  const upd = await db.from('broker_portals').update({
    last_checked_at: new Date().toISOString(),
    next_check_at:   next
  }).eq('id', id);
  if (upd.error){ toast('Update failed'); console.error(upd.error); return; }
  toast('Marked checked');
  load();
}

// ===== dialog =====
function openDlg(id){
  $('p_err').textContent='';
  const p = id ? rows.find(x=>x.id===id) : null;
  $('p_id').value = p?p.id:'';
  $('dlgTitle').textContent = p?'Edit Portal':'Add Portal';
  $('delBtn').style.display = p?'inline-block':'none';
  $('p_name').value     = p?(p.portal_name||''):'';
  $('p_broker').value   = p?(p.broker_name||''):'';
  $('p_url').value      = p?(p.portal_url||''):'';
  $('p_platform').value = p?(p.platform||''):'';
  $('p_user').value     = p?(p.username||''):'';
  $('p_cred').value     = p?(p.credential_ref||''):'';
  $('p_status').value   = p?(p.access_status||'pending'):'pending';
  $('p_freq').value     = p?(p.check_frequency||'daily'):'daily';
  $('p_besttime').value = p?(p.best_check_time||''):'';
  $('p_score').value    = p&&p.usefulness_score!=null?p.usefulness_score:'';
  $('p_oversize').checked = p?!!p.posts_oversize:false;
  $('p_notes').value    = p?(p.notes||''):'';
  $('dlg').showModal();
}

async function save(){
  $('p_err').textContent='';
  const name=txt($('p_name').value), url=txt($('p_url').value);
  if (!name){ $('p_err').textContent='Portal name is required.'; return; }
  if (!url){ $('p_err').textContent='Portal URL is required.'; return; }
  const btn=$('saveBtn'); btn.disabled=true;
  const id=txt($('p_id').value);
  const row = {
    portal_name:     name,
    broker_name:     txt($('p_broker').value),
    portal_url:      url,
    platform:        txt($('p_platform').value),
    username:        txt($('p_user').value),
    credential_ref:  txt($('p_cred').value),
    access_status:   $('p_status').value,
    check_frequency: $('p_freq').value,
    best_check_time: txt($('p_besttime').value),
    usefulness_score: num($('p_score').value),
    posts_oversize:  $('p_oversize').checked,
    notes:           txt($('p_notes').value)
  };
  let error=null;
  if (id){
    const r=await db.from('broker_portals').update(row).eq('id', id); error=r.error;
  } else {
    row.tenant_id=TENANT_ID;
    const r=await db.from('broker_portals').insert(row); error=r.error;
  }
  btn.disabled=false;
  if (error){ $('p_err').textContent=error.message; return; }
  $('dlg').close(); toast(id?'Updated':'Added'); load();
}

async function del(){
  const id=txt($('p_id').value); if(!id)return;
  if(!confirm('Delete this portal?'))return;
  const r=await db.from('broker_portals').delete().eq('id', id);
  if(r.error){ $('p_err').textContent=r.error.message; return; }
  $('dlg').close(); toast('Deleted'); load();
}

function wire(){
  $('addBtn').addEventListener('click', ()=>openDlg(null));
  $('saveBtn').addEventListener('click', save);
  $('delBtn').addEventListener('click', del);
  $('cancelBtn').addEventListener('click', ()=>$('dlg').close());
  ['q','fstatus','fdue'].forEach(id=>{
    $(id).addEventListener('input', render);
    $(id).addEventListener('change', render);
  });
}
</script>
</body>
</html>
