<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load Workspace — Dispatch</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#22221f; --muted:#73726c;
          --line:#e2e0da; --line2:#cfccc4; --accent:#185fa5; --accentbg:#e7f0f9;
          --danger:#a32d2d; --dangerbg:#fcebeb; --warn:#8a5a10; --warnbg:#fdf3e3;
          --ok:#0f6e56; --okbg:#e4f4ee; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { padding:18px; max-width:1100px; margin:0 auto 50px; }
  .hero { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  .heroTop { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .lnum { font-size:19px; font-weight:600; }
  .comm { color:var(--muted); font-size:13px; }
  .pill { padding:3px 10px; border-radius:12px; font-size:12px; white-space:nowrap; }
  .p-red { background:var(--dangerbg); color:var(--danger); }
  .p-amb { background:var(--warnbg); color:var(--warn); }
  .p-blu { background:var(--accentbg); color:var(--accent); }
  .p-grn { background:var(--okbg); color:var(--ok); }
  .p-gry { background:#f0efeb; color:var(--muted); border:1px solid var(--line); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .chip { font-size:12px; padding:3px 9px; border-radius:6px;
          background:#faf9f6; border:1px solid var(--line); color:var(--muted); }
  .chip.over { background:var(--warnbg); border-color:#e8d5ac; color:var(--warn); }
  .next { margin-top:12px; padding:9px 12px; border-radius:7px; font-size:13px;
          background:var(--accentbg); color:var(--accent); }
  .next.need { background:var(--dangerbg); color:var(--danger); }
  .flags { margin-top:10px; }
  .flag { font-size:12.5px; padding:7px 11px; border-radius:6px; margin-bottom:5px;
          background:var(--dangerbg); color:var(--danger); }
  .acts { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 18px; margin-bottom:14px; }
  .acts h3 { font-size:12px; font-weight:600; color:var(--muted); margin:0 0 9px;
             text-transform:uppercase; letter-spacing:.4px; }
  .btnrow { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  button { padding:7px 14px; border:1px solid var(--line2); border-radius:7px;
           background:var(--card); color:var(--ink); font-size:13px;
           cursor:pointer; font-family:inherit; margin:0; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.pri { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.warn { background:var(--warnbg); color:var(--warn); border-color:#e8d5ac; }
  button.dgr { background:var(--dangerbg); color:var(--danger); border-color:#eecccc; }
  .tabs { display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap; }
  .tab { padding:7px 13px; border:1px solid var(--line2); background:var(--card);
         border-radius:7px; font-size:13px; cursor:pointer; color:var(--muted); }
  .tab.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tab .ct { font-size:11px; opacity:.8; margin-left:3px; }
  .panel { display:none; } .panel.on { display:block; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  .card h2 { font-size:13px; font-weight:600; margin:0 0 12px;
             text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
  .info { display:grid; gap:10px 18px;
          grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
  .info div span { display:block; font-size:11.5px; color:var(--muted); }
  .info div b { font-weight:500; font-size:13.5px; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11.5px; font-weight:500; color:var(--muted);
       padding:7px 9px; border-bottom:1px solid var(--line); }
  td { padding:8px 9px; border-bottom:1px solid var(--line); font-size:13px;
       vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  .tl { border-left:2px solid var(--line); padding-left:14px; margin-left:4px; }
  .ev { padding:0 0 14px; position:relative; }
  .ev::before { content:''; position:absolute; left:-19px; top:5px; width:7px;
                height:7px; border-radius:50%; background:var(--line2); }
  .ev.mile::before { background:var(--accent); }
  .ev .t { font-size:11.5px; color:var(--muted); }
  .ev .s { font-weight:500; font-size:13.5px; }
  .ev .b { font-size:13px; color:var(--muted); }
  .ck { display:flex; align-items:flex-start; gap:9px; padding:6px 0; font-size:13px; }
  .ck input { margin-top:3px; width:15px; height:15px; }
  .ck.done label { color:var(--muted); text-decoration:line-through; }
  .phase { font-size:11.5px; font-weight:600; color:var(--muted); margin:16px 0 4px;
           text-transform:uppercase; letter-spacing:.4px; }
  .phase:first-child { margin-top:0; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line2);
    border-radius:7px; font-size:14px; background:#fff; color:var(--ink);
    font-family:inherit; }
  textarea { min-height:54px; resize:vertical; }
  .grid { display:grid; gap:11px;
          grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
  .full { grid-column:1/-1; }
  dialog { border:1px solid var(--line); border-radius:12px; padding:20px;
           max-width:520px; width:92%; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  dialog h3 { margin:0 0 14px; font-size:15px; }
  .msg { margin-top:11px; padding:9px 12px; border-radius:7px; font-size:13px;
         display:none; }
  .msg.err { display:block; background:var(--dangerbg); color:var(--danger); }
  .msg.ok { display:block; background:var(--okbg); color:var(--ok); }
  .empty { color:var(--muted); font-size:13px; padding:8px 0; }
  .addrow { display:flex; justify-content:flex-end; margin-bottom:12px; }
  .rowclick { cursor:pointer; }
  .rowclick:hover { background:#faf9f6; }
  .cbrow label { display:inline-flex; align-items:center; gap:5px; font-size:13px;
                 color:var(--ink); margin-right:14px; }
  .cbrow input { width:auto; }
</style>
</head>
<body>

<header></header>

<main>
  <div id="hero" class="hero"><div class="empty">Loading…</div></div>
  <div id="acts" class="acts" style="display:none"></div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab on" data-p="overview">Overview</button>
    <button class="tab" data-p="timeline">Timeline<span class="ct" id="ct-tl"></span></button>
    <button class="tab" data-p="permits">Permits<span class="ct" id="ct-pm"></span></button>
    <button class="tab" data-p="escorts">Escorts<span class="ct" id="ct-es"></span></button>
    <button class="tab" data-p="checklist">Checklist<span class="ct" id="ct-ck"></span></button>
    <button class="tab" data-p="expenses">Expenses<span class="ct" id="ct-ex"></span></button>
    <button class="tab" data-p="notes">Notes</button>
  </div>

  <div class="panel on" id="p-overview">
    <div class="card"><h2>General information</h2><div class="info" id="info"></div></div>
    <div class="card"><h2>Route</h2><div id="route"></div></div>
    <div class="card"><h2>Recent activity</h2><div id="recent"></div></div>
  </div>

  <div class="panel" id="p-timeline">
    <div class="card">
      <h2>Add a note to the timeline</h2>
      <div class="grid">
        <div class="full"><label>What happened</label>
          <textarea id="note_body" placeholder="Shipper says crane operator is running late"></textarea></div>
        <div><label>Type</label>
          <select id="note_type">
            <option value="note">Note</option>
            <option value="call">Phone call</option>
            <option value="email">Email</option>
            <option value="sms">Text message</option>
            <option value="issue">Issue</option>
          </select></div>
        <div><label>Direction</label>
          <select id="note_dir">
            <option value="internal">Internal</option>
            <option value="inbound">Inbound</option>
            <option value="outbound">Outbound</option>
          </select></div>
      </div>
      <button class="pri" id="note_save" style="margin-top:12px">Add to timeline</button>
      <div class="msg" id="note_msg"></div>
    </div>
    <div class="card"><h2>Full history</h2><div class="tl" id="timeline"></div></div>
  </div>

  <div class="panel" id="p-permits">
    <div class="card">
      <h2>Permits by state</h2>
      <div class="addrow"><button class="pri" onclick="openPermit()">Add permit</button></div>
      <div id="permits"></div>
    </div>
  </div>

  <div class="panel" id="p-escorts">
    <div class="card">
      <h2>Escort assignments</h2>
      <div class="addrow"><button class="pri" onclick="openEscort()">Add escort</button></div>
      <div id="escorts"></div>
    </div>
  </div>

  <div class="panel" id="p-checklist">
    <div class="card"><h2>Compliance checklist</h2><div id="checklist"></div></div>
  </div>

  <div class="panel" id="p-expenses">
    <div class="card"><h2>Margin</h2><div class="info" id="margin"></div></div>
    <div class="card">
      <h2>Record a charge</h2>
      <div class="grid">
        <div><label>Type</label>
          <select id="ch_kind">
            <option value="cost">Cost</option>
            <option value="revenue">Revenue</option>
          </select></div>
        <div><label>Category</label>
          <select id="ch_cat">
            <option value="linehaul">Linehaul</option>
            <option value="fuel">Fuel surcharge</option>
            <option value="detention">Detention</option>
            <option value="layover">Layover</option>
            <option value="tarp">Tarp</option>
            <option value="permit_fee">Permit fee</option>
            <option value="permit_service_fee">Permit service fee</option>
            <option value="escort">Escort</option>
            <option value="pilot_car">Pilot car</option>
            <option value="police">Police escort</option>
            <option value="driver_pay">Driver pay</option>
            <option value="fuel_purchase">Fuel purchase</option>
            <option value="tolls">Tolls</option>
            <option value="lumper">Lumper</option>
            <option value="repair">Repair</option>
            <option value="other">Other</option>
          </select></div>
        <div><label>Amount</label><input id="ch_amt" type="number" step="0.01"></div>
        <div><label>Date incurred</label><input id="ch_date" type="date"></div>
        <div class="full"><label>Description</label><input id="ch_desc"></div>
        <div><label>Billable to broker</label>
          <select id="ch_bill"><option value="false">No</option>
          <option value="true">Yes</option></select></div>
      </div>
      <button class="pri" id="ch_save" style="margin-top:12px">Add charge</button>
      <div class="msg" id="ch_msg"></div>
    </div>
    <div class="card"><h2>Charges on this load</h2><div id="charges"></div></div>
  </div>

  <div class="panel" id="p-notes">
    <div class="card">
      <h2>Load notes</h2>
      <textarea id="lnotes" style="min-height:150px"></textarea>
      <button class="pri" id="notes_save" style="margin-top:12px">Save notes</button>
      <div class="msg" id="notes_msg"></div>
    </div>
  </div>
</main>

<dialog id="dlg_ci">
  <h3>Log a check-in</h3>
  <div class="grid">
    <div class="full"><label>Location</label><input id="ci_loc" placeholder="Salina, KS"></div>
    <div><label>State</label><input id="ci_st" maxlength="2"></div>
    <div><label>ETA</label><input id="ci_eta" type="datetime-local"></div>
    <div><label>Hours remaining</label><input id="ci_h" type="number" step="0.5"></div>
    <div><label>Source</label>
      <select id="ci_src">
        <option value="driver_sms">Driver text</option>
        <option value="dispatcher">Phone call</option>
        <option value="driver_app">Driver app</option>
        <option value="eld">ELD</option>
      </select></div>
    <div class="full"><label>Note</label><textarea id="ci_note"></textarea></div>
  </div>
  <div class="btnrow" style="margin-top:14px">
    <button class="pri" id="ci_save">Save check-in</button>
    <button onclick="document.getElementById('dlg_ci').close()">Cancel</button>
  </div>
  <div class="msg" id="ci_msg"></div>
</dialog>

<dialog id="dlg_hold">
  <h3>Put this load on hold</h3>
  <div class="grid">
    <div class="full"><label>Reason</label>
      <select id="h_reason">
        <option value="breakdown">Mechanical breakdown</option>
        <option value="awaiting_permits">Awaiting permits</option>
        <option value="awaiting_escort">Awaiting escort</option>
        <option value="weather">Weather</option>
        <option value="traffic">Traffic</option>
        <option value="road_closure">Road closure</option>
        <option value="hos_shutdown">HOS shutdown</option>
        <option value="detention_shipper">Detention at shipper</option>
        <option value="detention_receiver">Detention at receiver</option>
        <option value="curfew">Curfew</option>
        <option value="holiday_restriction">Holiday restriction</option>
        <option value="other">Other</option>
      </select></div>
    <div class="full"><label>What's happening</label><textarea id="h_note"></textarea></div>
    <div class="full"><label>Expected to clear</label><input id="h_clear" type="datetime-local"></div>
  </div>
  <div class="btnrow" style="margin-top:14px">
    <button class="dgr" id="h_save">Put on hold</button>
    <button onclick="document.getElementById('dlg_hold').close()">Cancel</button>
  </div>
  <div class="msg" id="h_msg"></div>
</dialog>

<dialog id="dlg_permit">
  <h3 id="pm_title">Permit</h3>
  <input type="hidden" id="pm_id">
  <div class="grid">
    <div><label>State</label><input id="pm_state" maxlength="2"></div>
    <div><label>Status</label>
      <select id="pm_status">
        <option value="needed">Needed</option>
        <option value="applied">Applied</option>
        <option value="pending">Pending</option>
        <option value="issued">Issued</option>
        <option value="rejected">Rejected</option>
        <option value="amended">Amended</option>
        <option value="expired">Expired</option>
        <option value="cancelled">Cancelled</option>
        <option value="not_required">Not required</option>
      </select></div>
    <div><label>Permit number</label><input id="pm_number"></div>
    <div><label>Issuing authority</label><input id="pm_auth"></div>
    <div><label>Valid from</label><input id="pm_from" type="date"></div>
    <div><label>Valid to</label><input id="pm_to" type="date"></div>
    <div><label>Permit fee</label><input id="pm_fee" type="number" step="0.01"></div>
    <div><label>Service fee</label><input id="pm_svc" type="number" step="0.01"></div>
    <div><label>Driver has permit</label>
      <select id="pm_driver"><option value="false">No</option>
      <option value="true">Yes</option></select></div>
  </div>
  <div style="margin-top:12px">
    <label>Escorts this permit requires</label>
    <div class="cbrow">
      <label><input type="checkbox" id="pm_ef"> Front</label>
      <label><input type="checkbox" id="pm_er"> Rear</label>
      <label><input type="checkbox" id="pm_ehp"> High pole</label>
      <label><input type="checkbox" id="pm_ep"> Police</label>
    </div>
  </div>
  <div style="margin-top:12px"><label>Notes</label><textarea id="pm_notes"></textarea></div>
  <div class="btnrow" style="margin-top:14px">
    <button class="pri" id="pm_save">Save permit</button>
    <button onclick="document.getElementById('dlg_permit').close()">Cancel</button>
  </div>
  <div class="msg" id="pm_msg"></div>
</dialog>

<dialog id="dlg_escort">
  <h3 id="es_title">Escort</h3>
  <input type="hidden" id="es_id">
  <div class="grid">
    <div><label>Role</label>
      <select id="es_role">
        <option value="front">Front</option>
        <option value="rear">Rear</option>
        <option value="high_pole">High pole</option>
        <option value="police">Police</option>
        <option value="steer">Steer</option>
      </select></div>
    <div><label>Status</label>
      <select id="es_status">
        <option value="needed">Needed</option>
        <option value="quoted">Quoted</option>
        <option value="booked">Booked</option>
        <option value="confirmed">Confirmed</option>
        <option value="en_route">En route</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
        <option value="no_show">No show</option>
      </select></div>
    <div class="full"><label>Company / vehicle</label><input id="es_company"></div>
    <div><label>Escort driver name</label><input id="es_dname"></div>
    <div><label>Escort driver phone</label><input id="es_dphone"></div>
    <div class="full"><label>Meeting location</label><input id="es_mloc"></div>
    <div><label>Meeting time</label><input id="es_mtime" type="datetime-local"></div>
    <div><label>Quoted rate</label><input id="es_quoted" type="number" step="0.01"></div>
    <div><label>Confirmed rate</label><input id="es_confirmed" type="number" step="0.01"></div>
    <div><label>Actual cost</label><input id="es_actual" type="number" step="0.01"></div>
    <div><label>Contacts exchanged</label>
      <select id="es_contacts"><option value="false">No</option>
      <option value="true">Yes</option></select></div>
    <div><label>Confirmed day before</label>
      <select id="es_dayb"><option value="false">No</option>
      <option value="true">Yes</option></select></div>
  </div>
  <div style="margin-top:12px"><label>Notes</label><textarea id="es_notes"></textarea></div>
  <div class="btnrow" style="margin-top:14px">
    <button class="pri" id="es_save">Save escort</button>
    <button onclick="document.getElementById('dlg_escort').close()">Cancel</button>
  </div>
  <div class="msg" id="es_msg"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nav.js"></script>
<script>
const SUPABASE_URL = 'https://zyhdatteglxozsgnjhrm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5aGRhdHRlZ2x4b3pzZ25qaHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODEzMTAsImV4cCI6MjEwMDg1NzMxMH0.I4SlAWiqKk0oPv-0WRgVy_AAGnQ0NoT8-T8z62jIj7Y';

const $ = id => document.getElementById(id);
let db=null, tenant=null, loadId=null, L=null, me=null;
let PERMITS=[], ESCORTS=[];

const FLOW = {
  quoted:['booked'], booked:['permits_pending','dispatched'],
  permits_pending:['dispatched'], dispatched:['en_route_to_pickup'],
  en_route_to_pickup:['at_shipper'], at_shipper:['loading'],
  loading:['loaded'], loaded:['in_transit'],

};

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pretty(s){ return String(s||'').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()); }
function ftin(i){ return i==null?'—':Math.floor(i/12)+"' "+(i%12)+'"'; }
function money(n){ return n==null?'—':'$'+Number(n).toLocaleString(); }
function when(iso){ if(!iso) return '—'; const d=new Date(iso);
  return d.toLocaleDateString([],{month:'numeric',day:'numeric'})+' '+
         d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); }
function say(el,t,k){ const m=$(el); m.textContent=t; m.className='msg '+k;
  if(k==='ok') setTimeout(()=>{m.className='msg';},3500); }
function val(id){ const v=$(id).value.trim(); return v===''?null:v; }

window.onerror = m => { $('hero').innerHTML='<div class="flag">JS error: '+esc(m)+'</div>'; };

loadId = new URLSearchParams(location.search).get('id');

if (typeof window.supabase === 'undefined') {
  $('hero').innerHTML = '<div class="flag">Supabase library failed to load.</div>';
} else if (SUPABASE_ANON_KEY.indexOf('PASTE-YOUR')!==-1) {
  $('hero').innerHTML = '<div class="flag">Fill in SUPABASE_ANON_KEY.</div>';
} else if (!loadId) {
  $('hero').innerHTML = '<div class="flag">No load specified. Open this page from the Fleet Board or All Loads.</div>';
} else {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  start();
}

async function start(){
  const s = await db.auth.getSession();
  if (!s.data.session) { location.href='index.html'; return; }
  tenant = await buildNav(db, 'Load Workspace');
  if (!tenant) { $('hero').innerHTML='<div class="flag">No profile linked to this login.</div>'; return; }
  const u = await db.from('app_users').select('id').limit(1);
  me = u.data && u.data.length ? u.data[0].id : null;
  await refresh();
}

async function refresh(){
  const r = await db.from('loads').select('*').eq('id', loadId).single();
  if (r.error) { $('hero').innerHTML='<div class="flag">'+esc(r.error.message)+'</div>'; return; }
  const d = r.data;
  const [c,b,dr,tr,trl,og,de] = await Promise.all([
    d.carrier_id ? db.from('carriers').select('legal_name').eq('id',d.carrier_id).single() : {data:null},
    d.broker_id ? db.from('brokers').select('name').eq('id',d.broker_id).single() : {data:null},
    d.driver_id ? db.from('drivers').select('first_name,last_name,phone').eq('id',d.driver_id).single() : {data:null},
    d.tractor_id ? db.from('equipment').select('unit_number').eq('id',d.tractor_id).single() : {data:null},
    d.trailer_id ? db.from('equipment').select('unit_number,equipment_type').eq('id',d.trailer_id).single() : {data:null},
    d.origin_facility_id ? db.from('facilities').select('name,city,state').eq('id',d.origin_facility_id).single() : {data:null},
    d.dest_facility_id ? db.from('facilities').select('name,city,state').eq('id',d.dest_facility_id).single() : {data:null}
  ]);
  d.carriers=c.data; d.brokers=b.data; d.drivers=dr.data;
  d.tractor=tr.data; d.trailer=trl.data; d.origin=og.data; d.dest=de.data;
  L = d;
  drawHero(); drawActions(); drawInfo();
  await Promise.all([drawRoute(), drawTimeline(), drawPermits(),
                     drawEscorts(), drawChecklist(), drawExpenses()]);
  $('lnotes').value = L.notes || '';
  $('acts').style.display=''; $('tabs').style.display='';
}

function statusClass(s){
  if (['breakdown','accident','road_closure'].includes(s)) return 'p-red';
  if (L.hold_reason) return 'p-amb';
  if (['in_transit','loaded','dispatched','en_route_to_pickup'].includes(s)) return 'p-blu';
  if (['delivered','pod_pending','paid','invoiced'].includes(s)) return 'p-grn';
  if (['loading','at_shipper','at_receiver','unloading'].includes(s)) return 'p-amb';
  return 'p-gry';
}

async function drawHero(){
  const disp = L.hold_reason || L.status;
  let h = '<div class="heroTop">'+
    '<span class="lnum">'+esc(L.load_number)+'</span>'+
    '<span class="pill '+statusClass(disp)+'">'+pretty(disp)+'</span>';
  if (L.hold_reason) h += '<span class="comm">was '+pretty(L.status)+'</span>';
  if (L.priority && L.priority!=='normal')
    h += '<span class="pill p-amb">'+pretty(L.priority)+'</span>';
  h += '<span class="comm" style="margin-left:auto">'+esc(L.commodity||'')+'</span></div>';
  const over = [];
  if (L.width_in>102) over.push('w'); if (L.height_in>162) over.push('h');
  if (L.length_in>636) over.push('l'); if (L.weight_lb>80000) over.push('wt');
  h += '<div class="chips">'+
    '<span class="chip'+(over.includes('w')?' over':'')+'">'+ftin(L.width_in)+' wide</span>'+
    '<span class="chip'+(over.includes('h')?' over':'')+'">'+ftin(L.height_in)+' high</span>'+
    '<span class="chip'+(over.includes('l')?' over':'')+'">'+ftin(L.length_in)+' long</span>'+
    '<span class="chip'+(over.includes('wt')?' over':'')+'">'+
      (L.weight_lb?L.weight_lb.toLocaleString()+' lb':'—')+'</span>';
  if (L.current_location_text)
    h += '<span class="chip">'+esc(L.current_location_text)+
         (L.last_check_in_at?' · '+when(L.last_check_in_at):'')+'</span>';
  if (L.driver_hours_remaining_min!=null)
    h += '<span class="chip">'+Math.floor(L.driver_hours_remaining_min/60)+'h '+
         (L.driver_hours_remaining_min%60)+'m HOS</span>';
  h += '</div>';
  if (L.hold_note) h += '<div class="next need">'+esc(L.hold_note)+'</div>';
  $('hero').innerHTML = h;
  const na = await db.rpc('load_next_action', { p_load_id: loadId });
  if (!na.error && na.data) {
    const need = na.data !== 'On track';
    $('hero').insertAdjacentHTML('beforeend',
      '<div class="next'+(need?' need':'')+'">Next: '+esc(na.data)+'</div>');
  }
  const fl = await db.from('v_load_red_flags').select('flags').eq('load_id',loadId).single();
  if (!fl.error && fl.data && fl.data.flags && fl.data.flags.length) {
    $('hero').insertAdjacentHTML('beforeend', '<div class="flags">'+
      fl.data.flags.map(f=>'<div class="flag">'+esc(f)+'</div>').join('')+'</div>');
  }
}

// ---------- CHECKLIST ----------
async function drawChecklist(){
  const r = await db.from('load_checklist_items').select('*')
    .eq('load_id',loadId).order('phase').order('seq');
  const items = r.data || [];
  $('ct-ck').textContent = items.length
    ? ' '+items.filter(x=>x.done_at||x.not_applicable).length+'/'+items.length : '';
  if (!items.length) {
    $('checklist').innerHTML = '<div class="empty">No checklist for this load. '+
      '<button onclick="genChecklist()" style="margin-left:8px">Generate now</button></div>';
    return;
  }
  const order = ['before_booking','before_dispatch','before_pickup','en_route',
                 'before_delivery','after_delivery','oversize'];
  let h = '';
  order.forEach(ph => {
    const list = items.filter(x=>x.phase===ph);
    if (!list.length) return;
    h += '<div class="phase">'+pretty(ph)+'</div>';
    list.forEach(x => {
      const isDone = !!(x.done_at || x.not_applicable);
      h += '<div class="ck'+(isDone?' done':'')+'">'+
        '<input type="checkbox" '+(isDone?'checked':'')+
        ' onchange="toggleCk(\''+x.id+'\', this.checked)">'+
        '<label>'+esc(x.item)+'</label></div>';
    });
  });
  $('checklist').innerHTML = h;
}

async function genChecklist(){
  await db.rpc('generate_load_checklist', { p_load_id: loadId });
  drawChecklist();
}

async function toggleCk(id, on){
  await db.from('load_checklist_items').update({
    done_at: on ? new Date().toISOString() : null,
    done_by: on ? me : null
  }).eq('id', id);
  drawChecklist();
}

// ---------- EXPENSES ----------
async function drawExpenses(){
  const m = await db.from('v_load_margin').select('*').eq('load_id',loadId).single();
  if (!m.error && m.data) {
    const rev = Number(m.data.total_revenue)||0;
    const cost = Number(m.data.total_cost)||0;
    const net = rev - cost;
    const pct = rev ? Math.round(net/rev*100) : 0;
    const f = (label, v, cls) => '<div><span>'+label+'</span><b'+
      (cls?' style="color:'+cls+'"':'')+'>'+v+'</b></div>';
    $('margin').innerHTML =
      f('Revenue', money(rev)) +
      f('Cost', money(cost)) +
      f('Net margin', money(net), net>=0?'var(--ok)':'var(--danger)') +
      f('Margin %', pct+'%', net>=0?'var(--ok)':'var(--danger)');
  }
  const r = await db.from('load_charges').select('*')
    .eq('load_id',loadId).order('incurred_on',{nullsFirst:false})
    .order('created_at',{ascending:false});
  const ch = r.data || [];
  $('ct-ex').textContent = ch.length ? ' '+ch.length : '';
  $('charges').innerHTML = ch.length
    ? '<table><thead><tr><th>Type</th><th>Category</th><th>Description</th>'+
      '<th>Date</th><th>Billable</th><th>Amount</th><th></th></tr></thead><tbody>'+
      ch.map(x=>'<tr>'+
        '<td><span class="pill '+(x.kind==='revenue'?'p-grn':'p-amb')+'">'+
          pretty(x.kind)+'</span></td>'+
        '<td>'+pretty(x.category)+'</td>'+
        '<td>'+esc(x.description||'—')+'</td>'+
        '<td>'+(x.incurred_on||'—')+'</td>'+
        '<td>'+(x.billable?'Yes':'No')+'</td>'+
        '<td>'+money(x.amount)+'</td>'+
        '<td><span onclick="delCharge(\''+x.id+'\')" style="color:var(--danger);'+
          'cursor:pointer;font-size:12px">remove</span></td>'+
        '</tr>').join('')+'</tbody></table>'
    : '<div class="empty">No charges recorded. Permit fees and escort costs also '+
      'count toward margin automatically.</div>';
}

function openCheckIn(){

  $('ci_city').value  = '';
  $('ci_state').value = '';
  $('ci_miles').value = '';
  $('ci_eta').value   = '';
  $('ci_notes').value = '';
  dlgCheckIn.showModal();
}

async function saveCheckIn(){
  clearErr('ci_err');
  const btn = $('ci_save'); btn.disabled = true;

  const type  = $('ci_type').value;
  const when  = fromLocalInput($('ci_when').value) || new Date().toISOString();
  const city  = txt($('ci_city').value);
  const state = upper($('ci_state').value);
  const notes = txt($('ci_notes').value);

  const row = { tenant_id: TENANT_ID, load_id: LOAD_ID };
  row[CHECKIN.type]  = type;
  row[CHECKIN.when]  = when;
  row[CHECKIN.city]  = city;
  row[CHECKIN.state] = state;
  row[CHECKIN.miles] = num($('ci_miles').value);
  row[CHECKIN.eta]   = fromLocalInput($('ci_eta').value);
  row[CHECKIN.notes] = notes;

  const { error } = await db.from('check_ins').insert(row);
  if (error){ showErr('ci_err', error); btn.disabled = false; return; }

  const where = [city, state].filter(Boolean).join(', ');
  await logEvent({
    event_type: 'check_in',
    subject: titleize(type) + (where ? ' — ' + where : ''),
    body: notes,
    is_milestone: ['at_pickup','loaded','at_delivery','unloaded'].includes(type)
  });

  btn.disabled = false;
  dlgCheckIn.close();
  toast('Check-in logged');
  await refreshAll();
}

function openStatus(newStatus){
  PENDING_STATUS = newStatus;
  clearErr('st_err');
  $('st_notes').value = '';
  $('st_title').textContent =
    newStatus === 'cancelled'
      ? 'Cancel Load'
      : `${titleize(currentStatus())} → ${titleize(newStatus)}`;
  $('st_save').textContent = newStatus === 'cancelled' ? 'Cancel Load' : 'Confirm';
  $('st_save').className = newStatus === 'cancelled' ? 'danger' : 'primary';
  dlgStatus.showModal();
}

async function saveStatus(){
  if (!PENDING_STATUS) return;
  clearErr('st_err');
  const btn = $('st_save'); btn.disabled = true;

  const from = currentStatus();
  const to   = PENDING_STATUS;
  const statusKey = pickKey(LOAD, F.status) || 'status';

  const patch = {};
  patch[statusKey] = to;
  patch.updated_at = new Date().toISOString();

  const { error } = await db.from('loads').update(patch).eq('id', LOAD_ID);
  if (error){ showErr('st_err', error); btn.disabled = false; return; }

  /* subject carries the transition so the timeline can render it directly */
  await logEvent({
    event_type: 'status_change',
    subject: `${from} → ${to}`,
    body: txt($('st_notes').value),
    is_milestone: true
  });

  PENDING_STATUS = null;
  btn.disabled = false;
  dlgStatus.close();
  toast(`Status → ${titleize(to)}`);
  await refreshAll();
}

function openHold(){
  clearErr('hd_err');
  $('hd_reason').selectedIndex = 0;
  $('hd_notes').value = '';
  dlgHold.showModal();
}

async function saveHold(){
  clearErr('hd_err');
  const btn = $('hd_save'); btn.disabled = true;

  const reason = $('hd_reason').value;
  const detail = txt($('hd_notes').value);

  const holdKey   = pickKey(LOAD, F.onHold)     || 'on_hold';
  const reasonKey = pickKey(LOAD, F.holdReason) || 'hold_reason';
  const atKey     = pickKey(LOAD, F.holdAt)     || 'hold_started_at';

  const patch = { updated_at: new Date().toISOString() };
  patch[holdKey]   = true;
  patch[reasonKey] = detail ? `${reason} — ${detail}` : reason;
  patch[atKey]     = new Date().toISOString();

  const { error } = await db.from('loads').update(patch).eq('id', LOAD_ID);
  if (error){ showErr('hd_err', error); btn.disabled = false; return; }

  await logEvent({
    event_type: 'hold_started',
    subject: reason,
    body: detail,
    is_milestone: true
  });

  btn.disabled = false;
  dlgHold.close();
  toast('Load placed on hold');
  await refreshAll();
}

async function clearHold(){
  if (!confirm('Clear the hold on this load?')) return;

  const holdKey   = pickKey(LOAD, F.onHold)     || 'on_hold';
  const reasonKey = pickKey(LOAD, F.holdReason) || 'hold_reason';
  const atKey     = pickKey(LOAD, F.holdAt)     || 'hold_started_at';
  const prior     = pick(LOAD, F.holdReason);

  const patch = { updated_at: new Date().toISOString() };
  patch[holdKey]   = false;
  patch[reasonKey] = null;
  patch[atKey]     = null;

  const { error } = await db.from('loads').update(patch).eq('id', LOAD_ID);
  if (error){ fail('clearHold', error); return; }

  await logEvent({
    event_type: 'hold_cleared',
    subject: 'Hold cleared',
    body: prior ? `Was: ${prior}` : null,
    is_milestone: true
  });

  toast('Hold cleared');
  await refreshAll();
}

/* ============================================================
   TIMELINE
   ============================================================ */
function drawTimeline(){
  if (!EVENTS.length){
    $('tab-timeline').innerHTML = '<div class="card"><div class="empty">No events yet.</div></div>';
    return;
  }

  const items = EVENTS.map(ev => {
    const when = ev.occurred_at || ev.created_at;
    const type = ev.event_type || 'note';
    let headHTML = '';

    if (type === 'status_change'){
      /* transition is the heading; no repeated "Status changed" label */
      const raw = String(ev.subject || ev.body || '');
      const m = raw.split(/\s*(?:→|->|»)\s*/);
      headHTML = (m.length >= 2)
        ? `<div class="tl-head trans">${esc(titleize(m[0]))}<span class="arrow">→</span>${esc(titleize(m[1]))}</div>`
        : `<div class="tl-head trans">${esc(titleize(raw))}</div>`;
    } else if (ev.subject){
      headHTML = `<div class="tl-head">${esc(ev.subject)}</div>`;
    }

    const bodyHTML = (type === 'status_change')
      ? (ev.body ? `<div class="tl-body">${esc(ev.body)}</div>` : '')
      : (ev.body ? `<div class="tl-body">${esc(ev.body)}</div>` : '');

    return `<div class="tl-item${ev.is_milestone ? ' mile' : ''}">
      <div class="tl-when">
        <span>${esc(fmtDT(when))}</span>
        <span class="tl-type">${esc(String(type).replace(/_/g,' '))}</span>
        <span class="muted">${esc(ago(when))}</span>
      </div>
      ${headHTML}
      ${bodyHTML}
    </div>`;
  }).join('');

  $('tab-timeline').innerHTML = `
    <div class="sechead"><h2>Timeline</h2><span class="spacer"></span>
      <button class="sm" onclick="openNote()">Add Note</button></div>
    <div class="card box"><div class="tl">${items}</div></div>`;
}

const PERMIT_TONE = {
  not_required:'grey', needed:'warn', applied:'', pending:'warn',
  issued:'ok', rejected:'bad', expired:'bad', amended:'warn', cancelled:'grey'
};

function drawPermits(){
  const rows = PERMITS.map(p => {
    const escorts = [
      p.escort_front && 'F', p.escort_rear && 'R',
      p.escort_police && 'P', p.escort_high_pole && 'HP'
    ].filter(Boolean).join(' / ') || '—';

    const restr = [
      p.daylight_only && 'Daylight only',
      p.wind_limit_mph && `${p.wind_limit_mph} mph wind`,
      p.weekend_travel_allowed === false && 'No weekend',
      p.holiday_travel_allowed === false && 'No holiday'
    ].filter(Boolean).join(' · ') || '—';

    const cost = (Number(p.fee) || 0) + (Number(p.service_fee) || 0);

    return `<tr class="clickable" data-permit="${esc(p.id)}">
      <td><b>${esc(p.state || '—')}</b></td>
      <td><span class="pill ${PERMIT_TONE[p.status] !== undefined ? PERMIT_TONE[p.status] : 'grey'}">${esc(titleize(p.status))}</span></td>
      <td class="mono">${esc(p.permit_number || '—')}</td>
      <td>${esc(p.issuing_authority || '—')}</td>
      <td>${esc(toDateInput(p.valid_from) || '—')} → ${esc(toDateInput(p.valid_to) || '—')}</td>
      <td>${escorts}</td>
      <td class="small">${esc(restr)}</td>
      <td>${p.driver_has_permit ? '<span class="pill ok">Yes</span>' : '<span class="pill grey">No</span>'}</td>
      <td style="text-align:right">${cost ? money(cost) : '—'}</td>
    </tr>`;
  }).join('');

  $('tab-permits').innerHTML = `
    <div class="sechead"><h2>Permits</h2><span class="spacer"></span>
      <button class="primary sm" onclick="openPermit(null)">+ Add Permit</button></div>
    ${PERMITS.length ? `
    <div class="tablewrap"><table>
      <thead><tr>
        <th>State</th><th>Status</th><th>Permit #</th><th>Authority</th>
        <th>Valid</th><th>Escorts</th><th>Restrictions</th><th>Driver copy</th>
        <th style="text-align:right">Cost</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`
    : '<div class="card"><div class="empty">No permits on this load yet.</div></div>'}
  `;

  $$('#tab-permits tr[data-permit]').forEach(tr => {
    tr.addEventListener('click', () => openPermit(tr.dataset.permit));
  });
}

function openPermit(id){
  clearErr('pm_err');
  const p = id ? PERMITS.find(x => x.id === id) : null;

  $('pm_id').value      = p ? p.id : '';
  $('pm_title').textContent = p ? `Permit — ${p.state || ''}` : 'New Permit';
  $('pm_idlabel').textContent = p ? p.id.slice(0,8) : '';
  $('pm_delbtn').classList.toggle('hide', !p);

  $('pm_state').value                     = p ? (p.state || '') : '';
  $('pm_status').value                    = p ? (p.status || 'needed') : 'needed';
  $('pm_permit_number').value             = p ? (p.permit_number || '') : '';
  $('pm_issuing_authority').value         = p ? (p.issuing_authority || '') : '';
  $('pm_permit_service_id').value         = p ? (p.permit_service_id || '') : '';
  $('pm_fee').value                       = p && p.fee !== null && p.fee !== undefined ? p.fee : '';
  $('pm_service_fee').value               = p && p.service_fee !== null && p.service_fee !== undefined ? p.service_fee : '';

  $('pm_applied_at').value                = p ? toLocalInput(p.applied_at) : '';
  $('pm_issued_at').value                 = p ? toLocalInput(p.issued_at) : '';
  $('pm_valid_from').value                = p ? toDateInput(p.valid_from) : '';
  $('pm_valid_to').value                  = p ? toDateInput(p.valid_to) : '';

  $('pm_escort_front').checked            = p ? !!p.escort_front : false;
  $('pm_escort_rear').checked             = p ? !!p.escort_rear : false;
  $('pm_escort_police').checked           = p ? !!p.escort_police : false;
  $('pm_escort_high_pole').checked        = p ? !!p.escort_high_pole : false;

  $('pm_daylight_only').checked           = p ? !!p.daylight_only : false;
  $('pm_weekend_travel_allowed').checked  = p ? !!p.weekend_travel_allowed : false;
  $('pm_holiday_travel_allowed').checked  = p ? !!p.holiday_travel_allowed : false;
  $('pm_wind_limit_mph').value            = p && p.wind_limit_mph !== null && p.wind_limit_mph !== undefined ? p.wind_limit_mph : '';

  $('pm_travel_time_restrictions').value  = p ? (p.travel_time_restrictions || '') : '';
  $('pm_curfew_notes').value              = p ? (p.curfew_notes || '') : '';
  $('pm_route_restrictions').value        = p ? (p.route_restrictions || '') : '';

  $('pm_driver_has_permit').checked       = p ? !!p.driver_has_permit : false;
  $('pm_driver_briefed_at').value         = p ? toLocalInput(p.driver_briefed_at) : '';

  $('pm_notes').value                     = p ? (p.notes || '') : '';

  dlgPermit.showModal();
}

async function pm_save(){
  clearErr('pm_err');
  const btn = $('pm_savebtn');
  btn.disabled = true;

  const pm_id = txt($('pm_id').value);
  const pm_priorStatus = pm_id
    ? (PERMITS.find(x => x.id === pm_id) || {}).status || null
    : null;

  const pm_state  = upper($('pm_state').value);
  const pm_status = $('pm_status').value;

  if (!pm_state){
    showErr('pm_err', { message: 'State is required.' });
    btn.disabled = false;
    return;
  }

  const pm_row = {
    state:                     pm_state,
    permit_number:             txt($('pm_permit_number').value),
    issuing_authority:         txt($('pm_issuing_authority').value),
    permit_service_id:         txt($('pm_permit_service_id').value),
    status:                    pm_status,
    applied_at:                fromLocalInput($('pm_applied_at').value),
    issued_at:                 fromLocalInput($('pm_issued_at').value),
    valid_from:                txt($('pm_valid_from').value),
    valid_to:                  txt($('pm_valid_to').value),
    fee:                       num($('pm_fee').value),
    service_fee:               num($('pm_service_fee').value),
    route_restrictions:        txt($('pm_route_restrictions').value),
    travel_time_restrictions:  txt($('pm_travel_time_restrictions').value),
    escort_front:              $('pm_escort_front').checked,
    escort_rear:               $('pm_escort_rear').checked,
    escort_police:             $('pm_escort_police').checked,
    escort_high_pole:          $('pm_escort_high_pole').checked,
    daylight_only:             $('pm_daylight_only').checked,
    wind_limit_mph:            num($('pm_wind_limit_mph').value),
    curfew_notes:              txt($('pm_curfew_notes').value),
    weekend_travel_allowed:    $('pm_weekend_travel_allowed').checked,
    holiday_travel_allowed:    $('pm_holiday_travel_allowed').checked,
    driver_has_permit:         $('pm_driver_has_permit').checked,
    driver_briefed_at:         fromLocalInput($('pm_driver_briefed_at').value),
    notes:                     txt($('pm_notes').value),
    updated_at:                new Date().toISOString()
  };

  /* stamp issued_at automatically when flipping to issued without a date */
  if (pm_status === 'issued' && !pm_row.issued_at){
    pm_row.issued_at = new Date().toISOString();
  }

  let pm_err = null;
  if (pm_id){
    const r = await db.from('permits').update(pm_row).eq('id', pm_id);
    pm_err = r.error;
  } else {
    pm_row.tenant_id = TENANT_ID;
    pm_row.load_id   = LOAD_ID;
    const r = await db.from('permits').insert(pm_row);
    pm_err = r.error;
  }

  if (pm_err){ showErr('pm_err', pm_err); btn.disabled = false; return; }

  /* milestone fires only on the actual transition INTO issued */
  if (pm_status === 'issued' && pm_priorStatus !== 'issued'){
    await logEvent({
      event_type: 'permit_approved',
      subject: `${pm_state} permit issued`,
      body: [
        pm_row.permit_number ? 'Permit #' + pm_row.permit_number : null,
        pm_row.issuing_authority,
        (pm_row.valid_from || pm_row.valid_to)
          ? `Valid ${pm_row.valid_from || '?'} to ${pm_row.valid_to || '?'}` : null
      ].filter(Boolean).join(' · ') || null,
      is_milestone: true
    });
  }

  btn.disabled = false;
  dlgPermit.close();
  toast(pm_id ? 'Permit updated' : 'Permit added');
  await refreshAll();
}

async function pm_delete(){
  const pm_id = txt($('pm_id').value);
  if (!pm_id) return;
  if (!confirm('Delete this permit? This cannot be undone.')) return;

  const { error } = await db.from('permits').delete().eq('id', pm_id);
  if (error){ showErr('pm_err', error); return; }

  dlgPermit.close();
  toast('Permit deleted');
  await refreshAll();
}

/* ============================================================
   ESCORTS
   ============================================================ */
const ESCORT_TONE = {
  needed:'warn', quoted:'warn', booked:'', confirmed:'ok',
  en_route:'ok', completed:'ok', cancelled:'grey', no_show:'bad'
};
const ESCORT_MILESTONE = ['confirmed','en_route','completed'];

function drawEscorts(){
  const rows = ESCORTS.map(e => {
    const rate = e.actual_cost != null ? e.actual_cost
               : e.confirmed_rate != null ? e.confirmed_rate
               : e.quoted_rate;
    const rateLabel = e.actual_cost != null ? 'actual'
                    : e.confirmed_rate != null ? 'confirmed'
                    : e.quoted_rate != null ? 'quoted' : '';
    const ready = [
      e.contacts_exchanged && 'Contacts',
      e.confirmed_day_before && 'Day-before'
    ].filter(Boolean).join(' · ') || '—';

    return `<tr class="clickable" data-escort="${esc(e.id)}">
      <td><b>${esc(titleize(e.role))}</b></td>
      <td><span class="pill ${ESCORT_TONE[e.status] !== undefined ? ESCORT_TONE[e.status] : 'grey'}">${esc(titleize(e.status))}</span></td>
      <td>${esc(e.vehicle_info || '—')}</td>
      <td>${esc(e.driver_name || '—')}${e.driver_phone ? `<div class="small muted">${esc(e.driver_phone)}</div>` : ''}</td>
      <td>${esc(fmtDT(e.scheduled_start))}</td>
      <td>${esc(e.meeting_location || '—')}${e.meeting_time ? `<div class="small muted">${esc(fmtDT(e.meeting_time))}</div>` : ''}</td>
      <td class="small">${ready}</td>
      <td style="text-align:right">${rate != null ? money(rate) : '—'}
        ${rateLabel ? `<div class="small muted">${rateLabel}</div>` : ''}</td>
    </tr>`;
  }).join('');

  $('tab-escorts').innerHTML = `
    <div class="sechead"><h2>Escort Assignments</h2><span class="spacer"></span>
      <button class="primary sm" onclick="openEscort(null)">+ Add Escort</button></div>
    ${ESCORTS.length ? `
    <div class="tablewrap"><table>
      <thead><tr>
        <th>Role</th><th>Status</th><th>Vehicle</th><th>Driver</th>
        <th>Scheduled</th><th>Meet-up</th><th>Ready</th>
        <th style="text-align:right">Rate</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`
    : '<div class="card"><div class="empty">No escorts assigned yet.</div></div>'}
  `;

  $$('#tab-escorts tr[data-escort]').forEach(tr => {
    tr.addEventListener('click', () => openEscort(tr.dataset.escort));
  });
}

function openEscort(id){
  clearErr('es_err');
  const e = id ? ESCORTS.find(x => x.id === id) : null;

  $('es_id').value      = e ? e.id : '';
  $('es_title').textContent = e ? `Escort — ${titleize(e.role || '')}` : 'New Escort Assignment';
  $('es_idlabel').textContent = e ? e.id.slice(0,8) : '';
  $('es_delbtn').classList.toggle('hide', !e);

  $('es_role').value              = e ? (e.role || 'front') : 'front';
  $('es_status').value            = e ? (e.status || 'needed') : 'needed';
  $('es_escort_company_id').value = e ? (e.escort_company_id || '') : '';
  $('es_vehicle_info').value      = e ? (e.vehicle_info || '') : '';
  $('es_driver_name').value       = e ? (e.driver_name || '') : '';
  $('es_driver_phone').value      = e ? (e.driver_phone || '') : '';

  $('es_quoted_rate').value       = e && e.quoted_rate != null ? e.quoted_rate : '';
  $('es_confirmed_rate').value    = e && e.confirmed_rate != null ? e.confirmed_rate : '';
  $('es_actual_cost').value       = e && e.actual_cost != null ? e.actual_cost : '';

  $('es_scheduled_start').value   = e ? toLocalInput(e.scheduled_start) : '';
  $('es_scheduled_end').value     = e ? toLocalInput(e.scheduled_end) : '';
  $('es_meeting_time').value      = e ? toLocalInput(e.meeting_time) : '';
  $('es_meeting_location').value  = e ? (e.meeting_location || '') : '';

  $('es_contacts_exchanged').checked   = e ? !!e.contacts_exchanged : false;
  $('es_confirmed_day_before').checked = e ? !!e.confirmed_day_before : false;

  $('es_notes').value = e ? (e.notes || '') : '';

  dlgEscort.showModal();
}

/* --- ESCORT SAVE — standalone. Touches only escort_assignments. --- */
async function es_save(){
  clearErr('es_err');
  const btn = $('es_savebtn');
  btn.disabled = true;

  const es_id = txt($('es_id').value);
  const es_priorStatus = es_id
    ? (ESCORTS.find(x => x.id === es_id) || {}).status || null
    : null;

  const es_role   = $('es_role').value;
  const es_status = $('es_status').value;

  const es_row = {
    role:                 es_role,
    status:               es_status,
    escort_company_id:    txt($('es_escort_company_id').value),
    vehicle_info:         txt($('es_vehicle_info').value),
    driver_name:          txt($('es_driver_name').value),
    driver_phone:         txt($('es_driver_phone').value),
    quoted_rate:          num($('es_quoted_rate').value),
    confirmed_rate:       num($('es_confirmed_rate').value),
    actual_cost:          num($('es_actual_cost').value),
    scheduled_start:      fromLocalInput($('es_scheduled_start').value),
    scheduled_end:        fromLocalInput($('es_scheduled_end').value),
    meeting_location:     txt($('es_meeting_location').value),
    meeting_time:         fromLocalInput($('es_meeting_time').value),
    contacts_exchanged:   $('es_contacts_exchanged').checked,
    confirmed_day_before: $('es_confirmed_day_before').checked,
    notes:                txt($('es_notes').value),
    updated_at:           new Date().toISOString()
  };

  let es_err = null;
  if (es_id){
    const r = await db.from('escort_assignments').update(es_row).eq('id', es_id);
    es_err = r.error;
  } else {
    es_row.tenant_id = TENANT_ID;
    es_row.load_id   = LOAD_ID;
    const r = await db.from('escort_assignments').insert(es_row);
    es_err = r.error;
  }

  if (es_err){ showErr('es_err', es_err); btn.disabled = false; return; }

  /* milestone fires once — on first entry into the confirmed family */
  const es_wasConfirmed = ESCORT_MILESTONE.includes(es_priorStatus);
  const es_nowConfirmed = ESCORT_MILESTONE.includes(es_status);
  if (es_nowConfirmed && !es_wasConfirmed){
    await logEvent({
      event_type: 'escort_confirmed',
      subject: `${titleize(es_role)} escort ${es_status === 'confirmed' ? 'confirmed' : titleize(es_status)}`,
      body: [
        es_row.vehicle_info,
        es_row.driver_name ? `Driver: ${es_row.driver_name}` : null,
        es_row.driver_phone,
        es_row.meeting_location ? `Meet: ${es_row.meeting_location}` : null
      ].filter(Boolean).join(' · ') || null,
      is_milestone: true
    });
  }

  btn.disabled = false;
  dlgEscort.close();
  toast(es_id ? 'Escort updated' : 'Escort added');
  await refreshAll();
}

async function es_delete(){
  const es_id = txt($('es_id').value);
  if (!es_id) return;
  if (!confirm('Delete this escort assignment? This cannot be undone.')) return;

  const { error } = await db.from('escort_assignments').delete().eq('id', es_id);
  if (error){ showErr('es_err', error); return; }

  dlgEscort.close();
  toast('Escort deleted');
  await refreshAll();
}

/* ============================================================
   CHECKLIST
   ============================================================ */
function drawChecklist(){
  if (!CHECKLIST.length){
    $('tab-checklist').innerHTML =
      '<div class="card"><div class="empty">No checklist items for this load.</div></div>';
    return;
  }

  const rows = CHECKLIST.map(c => {
    const done = !!pick(c, CL.done);
    return `<tr>
      <td style="width:36px"><input type="checkbox" data-cl="${esc(c.id)}" ${done ? 'checked' : ''}></td>
      <td style="${done ? 'text-decoration:line-through;color:var(--muted)' : 'font-weight:600'}">
        ${esc(pick(c, CL.label) || '(untitled)')}</td>
      <td>${esc(titleize(pick(c, CL.category)) || '—')}</td>
      <td class="small muted">${esc(pick(c, CL.notes) || '')}</td>
      <td class="small muted">${done ? esc(fmtDT(pick(c, CL.doneAt))) : ''}</td>
    </tr>`;
  }).join('');

  const done = CHECKLIST.filter(c => !!pick(c, CL.done)).length;

  $('tab-checklist').innerHTML = `
    <div class="sechead"><h2>Pre-Trip Checklist</h2>
      <span class="pill ${done === CHECKLIST.length ? 'ok' : 'warn'}">${done} / ${CHECKLIST.length}</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th></th><th>Item</th><th>Category</th><th>Notes</th><th>Completed</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;

  $$('#tab-checklist input[data-cl]').forEach(cb => {
    cb.addEventListener('change', () => toggleChecklist(cb.dataset.cl, cb.checked));
  });
}

async function toggleChecklist(id, checked){
  const item = CHECKLIST.find(c => c.id === id);
  const doneKey   = pickKey(item, CL.done)   || 'is_done';
  const doneAtKey = pickKey(item, CL.doneAt) || 'completed_at';

  const patch = {};
  patch[doneKey]   = checked;
  patch[doneAtKey] = checked ? new Date().toISOString() : null;

  const { error } = await db.from('load_checklist_items').update(patch).eq('id', id);
  if (error){ fail('toggleChecklist', error); return; }

  await fetchChecklist();
  drawCounts();
  drawChecklist();
}

/* ============================================================
   EXPENSES
   ============================================================ */
const CHARGE_CATEGORIES = ['linehaul','fuel','detention','layover','tarp','permit_fee',
  'permit_service_fee','escort','pilot_car','police','driver_pay','fuel_purchase',
  'tolls','lumper','repair','other'];

function drawExpenses(){
  const rev = MARGIN ? Number(MARGIN.total_revenue || 0) : 0;
  const cst = MARGIN ? Number(MARGIN.total_cost || 0) : 0;
  const mar = rev - cst;
  const pct = rev > 0 ? Math.round((mar / rev) * 100) : null;

  /* derived costs already tracked on the permit / escort records */
  const permitFee    = PERMITS.reduce((s,p) => s + (Number(p.fee) || 0), 0);
  const permitSvc    = PERMITS.reduce((s,p) => s + (Number(p.service_fee) || 0), 0);
  const escortCost   = ESCORTS.reduce((s,e) => s +
    (e.actual_cost != null ? Number(e.actual_cost)
     : e.confirmed_rate != null ? Number(e.confirmed_rate)
     : Number(e.quoted_rate) || 0), 0);

  const chargeRows = CHARGES.map(c => `
    <tr class="clickable" data-charge="${esc(c.id)}">
      <td><span class="pill ${c.kind === 'revenue' ? 'ok' : 'grey'}">${esc(titleize(c.kind))}</span></td>
      <td><b>${esc(titleize(c.category))}</b></td>
      <td>${esc(c.description || '—')}</td>
      <td>${esc(toDateInput(c.incurred_on) || '—')}</td>
      <td>${c.billable ? '<span class="pill ok">Billable</span>' : '<span class="pill grey">No</span>'}</td>
      <td style="text-align:right;font-weight:700;color:${c.kind === 'revenue' ? 'var(--ok)' : 'var(--ink)'}">
        ${money(c.amount)}</td>
    </tr>`).join('');

  $('tab-expenses').innerHTML = `
    <div class="grid2" style="margin-bottom:12px">
      <div class="card box">
        <h3>Margin (v_load_margin)</h3>
        <dl class="kv">
          <dt>Total revenue</dt><dd style="font-weight:700;color:var(--ok)">${money(rev)}</dd>
          <dt>Total cost</dt><dd style="font-weight:700">${money(cst)}</dd>
          <dt>Margin</dt><dd style="font-weight:700;font-size:16px;color:${mar >= 0 ? 'var(--ok)' : 'var(--bad)'}">
            ${money(mar)}${pct !== null ? ` <span class="small muted">(${pct}%)</span>` : ''}</dd>
        </dl>
      </div>
      <div class="card box">
        <h3>Costs Carried On Permit / Escort Records</h3>
        <dl class="kv">
          <dt>Permit state fees</dt><dd>${money(permitFee)}</dd>
          <dt>Permit service fees</dt><dd>${money(permitSvc)}</dd>
          <dt>Escort cost</dt><dd>${money(escortCost)}</dd>
        </dl>
        <div class="small muted" style="margin-top:10px">
          These are stored on the permit and escort records themselves. Only add a
          <b>permit_fee</b>, <b>permit_service_fee</b>, <b>escort</b>, <b>pilot_car</b> or
          <b>police</b> charge below if <span class="mono">v_load_margin</span> does
          <i>not</i> already pull from those tables — otherwise it double-counts.
        </div>
      </div>
    </div>

    <div class="sechead"><h2>Charges (load_charges)</h2><span class="spacer"></span>
      <button class="primary sm" onclick="openCharge(null)">+ Add Charge</button></div>
    ${CHARGES.length ? `
    <div class="tablewrap"><table>
      <thead><tr><th>Kind</th><th>Category</th><th>Description</th><th>Incurred</th>
        <th>Billable</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody>${chargeRows}</tbody>
    </table></div>`
    : '<div class="card"><div class="empty">No charges recorded yet.</div></div>'}
  `;

  $$('#tab-expenses tr[data-charge]').forEach(tr => {
    tr.addEventListener('click', () => openCharge(tr.dataset.charge));
  });
}

function openCharge(id){
  clearErr('ch_err');
  const c = id ? CHARGES.find(x => x.id === id) : null;

  $('ch_id').value = c ? c.id : '';
  $('ch_title').textContent = c ? 'Edit Charge' : 'Add Charge';
  $('ch_delbtn').classList.toggle('hide', !c);

  $('ch_kind').value        = c ? (c.kind || 'cost') : 'cost';
  $('ch_category').value    = c ? (c.category || 'other') : 'linehaul';
  $('ch_amount').value      = c && c.amount != null ? c.amount : '';
  $('ch_incurred_on').value = c ? toDateInput(c.incurred_on) : todayISO();
  $('ch_description').value = c ? (c.description || '') : '';
  $('ch_billable').checked  = c ? !!c.billable : true;

  dlgCharge.showModal();
}

async function saveCharge(){
  clearErr('ch_err');
  const btn = $('ch_save'); btn.disabled = true;

  const id       = txt($('ch_id').value);
  const kind     = $('ch_kind').value;
  const category = $('ch_category').value;
  const amount   = num($('ch_amount').value);

  if (amount === null){
    showErr('ch_err', { message: 'Amount is required.' });
    btn.disabled = false; return;
  }
  if (!CHARGE_CATEGORIES.includes(category)){
    showErr('ch_err', { message: 'Invalid category.' });
    btn.disabled = false; return;
  }

  const row = {
    kind, category, amount,
    description: txt($('ch_description').value),
    billable:    $('ch_billable').checked,
    incurred_on: txt($('ch_incurred_on').value) || todayISO()
  };

  let error = null;
  if (id){
    const r = await db.from('load_charges').update(row).eq('id', id);
    error = r.error;
  } else {
    row.tenant_id = TENANT_ID;
    row.load_id   = LOAD_ID;
    const r = await db.from('load_charges').insert(row);
    error = r.error;
  }
  if (error){ showErr('ch_err', error); btn.disabled = false; return; }

  if (!id){
    await logEvent({
      event_type: 'charge_added',
      subject: `${titleize(kind)} — ${titleize(category)} ${money(amount)}`,
      body: row.description,
      is_milestone: false
    });
  }

  btn.disabled = false;
  dlgCharge.close();
  toast(id ? 'Charge updated' : 'Charge added');
  await refreshAll();
}

async function deleteCharge(){
  const id = txt($('ch_id').value);
  if (!id) return;
  if (!confirm('Delete this charge?')) return;

  const { error } = await db.from('load_charges').delete().eq('id', id);
  if (error){ showErr('ch_err', error); return; }

  dlgCharge.close();
  toast('Charge deleted');
  await refreshAll();
}

/* ============================================================
   NOTES
   ============================================================ */
const NOTE_TYPES = ['note','call','email','sms','issue'];

function drawNotes(){
  const notes = EVENTS.filter(e => NOTE_TYPES.includes(e.event_type));

  const items = notes.map(n => `
    <div class="tl-item${n.is_milestone ? ' mile' : ''}">
      <div class="tl-when">
        <span>${esc(fmtDT(n.occurred_at || n.created_at))}</span>
        <span class="tl-type">${esc(String(n.event_type))}</span>
        <span class="muted">${esc(ago(n.occurred_at || n.created_at))}</span>
      </div>
      ${n.subject ? `<div class="tl-head">${esc(n.subject)}</div>` : ''}
      ${n.body ? `<div class="tl-body">${esc(n.body)}</div>` : ''}
    </div>`).join('');

  $('tab-notes').innerHTML = `
    <div class="sechead"><h2>Notes &amp; Communication</h2><span class="spacer"></span>
      <button class="primary sm" onclick="openNote()">+ Add Note</button></div>
    ${notes.length
      ? `<div class="card box"><div class="tl">${items}</div></div>`
      : '<div class="card"><div class="empty">No notes yet.</div></div>'}`;
}

function openNote(){
  clearErr('nt_err');
  $('nt_type').value = 'note';
  $('nt_subject').value = '';
  $('nt_body').value = '';
  $('nt_milestone').checked = false;
  dlgNote.showModal();
}

async function saveNote(){
  clearErr('nt_err');
  const body = txt($('nt_body').value);
  if (!body){
    showErr('nt_err', { message: 'Body is required.' });
    return;
  }
  const btn = $('nt_save'); btn.disabled = true;

  const ok = await logEvent({
    event_type:   $('nt_type').value,
    subject:      txt($('nt_subject').value),
    body:         body,
    is_milestone: $('nt_milestone').checked
  });

  btn.disabled = false;
  if (!ok){ showErr('nt_err', { message: 'Save failed — see console.' }); return; }

  dlgNote.close();
  toast('Note saved');
  await refreshAll();
}

boot();
