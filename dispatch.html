<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Dispatch — Heavy Haul Command</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="theme.css">

  <style>

    /* ============================================================
       DISPATCH HUB — BASIC STRUCTURE
       ============================================================ */

    .hub-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 38px 24px 70px;
    }

    .hub-heading {
      margin-bottom: 28px;
    }

    .hub-heading h1 {
      margin: 0 0 6px;

      font-size: 30px;
      font-weight: 700;
    }

    .hub-heading p {
      margin: 0;

      color: #777777;

      font-size: 13px;
    }

    .hub-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 16px;
    }

    .hub-card {
      display: block;

      min-height: 150px;

      padding: 22px;

      background: #ffffff;

      border: 1px solid #dddddd;

      color: #222222;

      text-decoration: none;

      transition:
        border-color .15s ease,
        transform .15s ease,
        box-shadow .15s ease;
    }

    .hub-card:hover {
      border-color: #999999;

      transform: translateY(-2px);

      box-shadow:
        0 8px 20px
        rgba(0, 0, 0, .06);
    }

    .hub-card-title {
      margin-bottom: 8px;

      font-size: 18px;
      font-weight: 600;
    }

    .hub-card-note {
      color: #777777;

      font-size: 12.5px;

      line-height: 1.5;
    }

    @media (max-width: 760px) {

      .hub-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

  <header></header>


  <main class="hub-wrap">

    <section class="hub-heading">

      <h1>
        Dispatch
      </h1>

      <p>
        Manage loads and daily dispatch activity.
      </p>

    </section>


    <section class="hub-grid">


      <a
        class="hub-card"
        href="board.html"
      >

        <div class="hub-card-title">
          Fleet Board
        </div>

        <div class="hub-card-note">
          View current fleet status, active assignments,
          and load activity.
        </div>

      </a>


      <a
        class="hub-card"
        href="newload.html"
      >

        <div class="hub-card-title">
          New Load
        </div>

        <div class="hub-card-note">
          Create and begin managing a new load.
        </div>

      </a>


      <a
        class="hub-card"
        href="loads.html"
      >

        <div class="hub-card-title">
          All Loads
        </div>

        <div class="hub-card-note">
          Review active, completed, upcoming,
          and historical loads.
        </div>

      </a>


    </section>

  </main>


  <script src="nav.js"></script>


  <script>

    const db =
      window.supabase.createClient(
        SUPABASE_URL,

    // ==========================================================

    async function start() {

      ) {

        location.href =

        return;

      }


      await buildNav(
        db,
        'Dispatch'
      );

    }


    start();

  </script>


</body>

</html>
